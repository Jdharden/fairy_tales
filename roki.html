<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ROKI - A Very Good Boy</title>
<style>
  @font-face {
    font-family: 'PixelFont';
    src: local('Courier New');
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0f0f1a; overflow: hidden;
    font-family: 'Courier New', monospace;
    touch-action: none;
  }
  #gameWrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #0f0f1a;
  }
  #screen {
    position: relative;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    box-shadow: 0 0 0 4px #3a3a52, 0 0 24px rgba(0,0,0,0.6);
  }
  canvas { display: block; image-rendering: pixelated; }

  /* --- Touch controls --- */
  #touchLayer {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
  }
  .ctrlBtn {
    position: absolute; pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: 'Courier New', monospace; font-weight: bold;
    background: rgba(20,20,30,0.38); border: 2px solid rgba(255,255,255,0.5);
    -webkit-user-select: none; user-select: none;
  }
  .ctrlBtn:active, .ctrlBtn.pressed { background: rgba(255,255,255,0.35); }
  #dpad { position: absolute; left: 4vw; bottom: 6vh; width: 34vw; height: 34vw; max-width: 170px; max-height: 170px; }
  .dpadSeg { position: absolute; width: 34%; height: 34%; border-radius: 6px; font-size: 20px; }
  #dUp { top: 0; left: 33%; }
  #dDown { top: 66%; left: 33%; }
  #dLeft { top: 33%; left: 0; }
  #dRight { top: 33%; left: 66%; }
  #dCenter { top: 33%; left: 33%; background: rgba(20,20,30,0.15); border-color: rgba(255,255,255,0.25); }
  #actionWrap { position: absolute; right: 5vw; bottom: 7vh; width: 38vw; max-width: 190px; height: 20vw; max-height: 100px; }
  #btnA { position: absolute; right: 0; bottom: 0; width: 17vw; height: 17vw; max-width: 84px; max-height: 84px; border-radius: 50%; font-size: 22px; }
  #btnB { position: absolute; right: 19vw; bottom: 2vw; width: 13vw; height: 13vw; max-width: 64px; max-height: 64px; border-radius: 50%; font-size: 16px; opacity: 0.85; }
  #btnStart { position: absolute; top: 3vh; right: 3vw; width: 60px; height: 26px; border-radius: 12px; font-size: 9px; pointer-events: auto; }
  #btnMute { position: absolute; top: 3vh; left: 3vw; width: 34px; height: 34px; border-radius: 50%; font-size: 15px; pointer-events: auto; }
  #btnQuest { position: absolute; top: 3vh; right: calc(3vw + 68px); width: 34px; height: 34px; border-radius: 50%; font-size: 15px; pointer-events: auto; }

  @media (min-width: 820px) and (pointer: fine) {
    #dpad, #actionWrap { display: none; }
  }

  #overlay {
    position: fixed; inset: 0; z-index: 100; display: flex;
    align-items: center; justify-content: center; flex-direction: column;
    background: rgba(6,8,16,0.92); color: #f4f0e6; text-align: center;
    padding: 20px; display: none;
  }
  #overlay h1 { font-size: clamp(28px, 8vw, 54px); letter-spacing: 4px; margin: 0 0 6px; color: #ffd23f; text-shadow: 3px 3px 0 #7a4a1e, -2px -2px 0 #3a1f0a; }
  #overlay p { font-size: clamp(11px, 2.6vw, 15px); line-height: 1.7; max-width: 480px; margin: 6px 0; }
  #overlay button.bigBtn {
    margin-top: 18px; padding: 12px 26px; font-size: 14px; font-weight: bold;
    background: #ffd23f; color: #3a2a0f; border: 3px solid #3a2a0f; border-radius: 4px;
    cursor: pointer; letter-spacing: 1px; font-family: inherit;
  }
  #overlay button.bigBtn:active { transform: translateY(2px); }
  #questPanel {
    position: fixed; inset: 0; z-index: 90; display: none;
    align-items: center; justify-content: center; background: rgba(6,8,16,0.85);
  }
  #questBox {
    background: #1b1830; border: 3px solid #ffd23f; border-radius: 6px; padding: 16px 20px;
    max-width: 380px; width: 86%; color: #f4f0e6; font-size: 12px; line-height: 2;
  }
  #questBox h2 { color: #ffd23f; font-size: 14px; margin: 0 0 10px; letter-spacing: 2px; }
  .qItem { display: flex; align-items: center; gap: 8px; }
  .qDone { color: #7be07b; }
  .qTodo { color: #cfc9b8; opacity: 0.75; }
  #questBox .closeHint { margin-top: 12px; font-size: 10px; opacity: 0.6; text-align: center; }
</style>
</head>
<body>
<div id="gameWrap">
  <div id="screen">
    <canvas id="game" width="160" height="144"></canvas>
  </div>
</div>

<div id="touchLayer">
  <div id="dpad">
    <div id="dCenter" class="ctrlBtn"></div>
    <div id="dUp" class="ctrlBtn dpadSeg">&#9650;</div>
    <div id="dDown" class="ctrlBtn dpadSeg">&#9660;</div>
    <div id="dLeft" class="ctrlBtn dpadSeg">&#9664;</div>
    <div id="dRight" class="ctrlBtn dpadSeg">&#9654;</div>
  </div>
  <div id="actionWrap">
    <div id="btnB" class="ctrlBtn">B</div>
    <div id="btnA" class="ctrlBtn">A</div>
  </div>
  <div id="btnStart" class="ctrlBtn">START</div>
  <div id="btnMute" class="ctrlBtn">&#128266;</div>
  <div id="btnQuest" class="ctrlBtn">&#9776;</div>
</div>

<div id="overlay">
  <h1>ROKI</h1>
  <p id="overlaySub">a good boy's day out</p>
  <div id="overlayExtra"></div>
  <button class="bigBtn" id="overlayBtn">PRESS START</button>
</div>

<div id="questPanel">
  <div id="questBox">
    <h2>MAKE ROKI HAPPY</h2>
    <div id="questList"></div>
    <h2 style="margin-top:14px;">BONUS CHALLENGES</h2>
    <div id="bonusList"></div>
    <div class="closeHint">tap anywhere to close</div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   CONSTANTS
========================================================= */
const TILE = 16;
const VIEW_W = 160, VIEW_H = 144; // native GB-style resolution
const VIEW_TILES_X = VIEW_W / TILE, VIEW_TILES_Y = VIEW_H / TILE;
const MAP_W = 48, MAP_H = 36; // in tiles
const WORLD_W = MAP_W * TILE, WORLD_H = MAP_H * TILE;

// tile ids
const T = {
  GRASS: 0, GRASS2: 1, LAWN: 2, ROAD: 3, ROAD_LINE: 4, SIDEWALK: 5,
  DIRT: 6, HEDGE: 7, WALL: 8, ROOF: 9, DOOR: 10, WATER: 11
};

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* =========================================================
   PALETTE
========================================================= */
const PAL = {
  grassA: '#7bc95a', grassB: '#69b74b', grassEdge: '#4f9a38',
  lawnA: '#a3d67a', lawnB: '#93c968',
  roadA: '#6b6f76', roadB: '#5c6066', roadLine: '#d8d3b8',
  sidewalkA: '#cfc7ae', sidewalkB: '#c2b99e',
  dirtA: '#8a5a3a', dirtB: '#7a4d30',
  hedge: '#3f7a28',
  sky: '#8fc7e8'
};

/* =========================================================
   SPRITE BUILDER  (pixel-string -> offscreen canvas)
========================================================= */
function spr(rows, palette){
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const img = g.createImageData(w, h);
  for (let y = 0; y < h; y++){
    for (let x = 0; x < w; x++){
      const ch = rows[y][x];
      const col = palette[ch];
      const i = (y*w+x)*4;
      if (!col){ img.data[i+3] = 0; continue; }
      img.data[i] = col[0]; img.data[i+1] = col[1]; img.data[i+2] = col[2]; img.data[i+3] = col[3] === undefined ? 255 : col[3];
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}
function hx(hex){
  const n = parseInt(hex.slice(1), 16);
  return [(n>>16)&255, (n>>8)&255, n&255, 255];
}

/* =========================================================
   ROKI SPRITES  (black coat, white chest, brown eyebrow dots,
   brown paws, semi-flopped ears, swishy tail)
========================================================= */
const P_ROKI = {
  '.': null,
  'K': hx('#1c1c1c'),   // black coat
  'k': hx('#141414'),   // black shade
  'W': hx('#f5f2ea'),   // white chest
  'w': hx('#ded8c8'),   // white shade
  'B': hx('#8a5a34'),   // brown (eyebrows/paws)
  'b': hx('#6e4527'),   // brown shade
  'E': hx('#2a2a2a'),   // eye
  'e': hx('#ffffff'),   // eye glint
  'N': hx('#0d0d0d'),   // nose
  'P': hx('#e39aa6'),   // tongue
};

// --- Grid builder: avoids hand-counted-string misalignment bugs ---
function blankGrid(w,h,fill){ return Array.from({length:h}, ()=> new Array(w).fill(fill)); }
function grect(g,x,y,w,h,ch){ for(let yy=y;yy<y+h;yy++){ if(!g[yy])continue; for(let xx=x;xx<x+w;xx++){ if(xx>=0&&xx<g[0].length) g[yy][xx]=ch; } } }
function gpx(g,x,y,ch){ if(g[y] && x>=0 && x<g[0].length) g[y][x]=ch; }
function gRows(g){ return g.map(r=>r.join('')); }

// DOWN (facing player) - big-headed chibi pose for extra cuteness, two frames
function rokiDownGrid(bounce){
  const g = blankGrid(16,16,'.');
  // big rounded floppy ears
  grect(g,1,2,4,4,'K'); grect(g,11,2,4,4,'K');
  grect(g,2,3,2,2,'k'); grect(g,12,3,2,2,'k');
  gpx(g,1, bounce?4:3, 'k'); gpx(g,14, bounce?4:3, 'k');
  // big round head (chibi proportions)
  grect(g,2,3,12,7,'K');
  grect(g,3,2,10,1,'K');
  // big sparkly eyes
  grect(g,4,6,3,3,'W'); grect(g,9,6,3,3,'W');
  grect(g,5,7,2,2,'E'); grect(g,10,7,2,2,'E');
  gpx(g,5,7,'e'); gpx(g,10,7,'e');
  // brown eyebrow dots
  gpx(g,5,5,'B'); gpx(g,10,5,'B');
  // small snout + nose
  grect(g,6,9,4,2,'w'); gpx(g,7,9,'N'); gpx(g,8,9,'N');
  gpx(g,7,10,'P');
  // small chubby body (smaller than head = cute)
  grect(g,4,10,8,4,'K');
  grect(g,6,11,4,3,'W');
  // little paws
  grect(g,4, bounce?14:13,2,2,'B'); grect(g,10, bounce?14:13,2,2,'B');
  // tiny tail peek
  gpx(g,2, bounce?13:14,'b'); gpx(g,1, bounce?12:13,'b');
  return gRows(g);
}
const ROKI_DOWN_0 = rokiDownGrid(false);
const ROKI_DOWN_1 = rokiDownGrid(true);

// UP (back view) - big round head/back, no face, tail swishes side to side
function rokiUpGrid(tailRight){
  const g = blankGrid(16,16,'.');
  // ear bumps sticking up
  grect(g,1,1,4,4,'K'); grect(g,11,1,4,4,'K');
  grect(g,2,2,2,2,'k'); grect(g,12,2,2,2,'k');
  // big rounded head+body, SAME width top to bottom (no taper = reads as a
  // round chibi back, not a triangle)
  grect(g,2,3,12,12,'K');
  grect(g,3,2,10,1,'K');
  // subtle neck shade so head/body don't read as one flat slab
  grect(g,2,9,12,1,'k');
  // little paw hints at the bottom
  grect(g,3,14,2,1,'B'); grect(g,11,14,2,1,'B');
  // tail poking out one side, swishing frame to frame
  if (tailRight){ grect(g,13,9,3,3,'b'); grect(g,14,6,2,4,'b'); grect(g,14,4,2,2,'K'); }
  else { grect(g,0,9,3,3,'b'); grect(g,0,6,2,4,'b'); gpx(g,0,4,'K'); gpx(g,1,4,'K'); }
  return gRows(g);
}
const ROKI_UP_0 = rokiUpGrid(false);
const ROKI_UP_1 = rokiUpGrid(true);

// SIDE (right-facing profile) - big head, cute stubby legs, tail out back
// layout left-to-right: tail(0-2) | ear(3-7) | head+eye(6-10) | snout(11-13)
function rokiSideGrid(strideA){
  const g = blankGrid(16,16,'.');
  // tail (out the back / left side)
  grect(g,0,7,2,2,'b'); grect(g,1,5,2,3,'b');
  // big rounded ear flop
  grect(g,4,1,4,4,'K'); gpx(g,4,4,'k'); gpx(g,5,5,'k');
  // big round head
  grect(g,3,3,10,6,'K');
  // eye near the front of the head, just before the snout
  grect(g,8,6,3,3,'W'); grect(g,9,7,2,2,'E'); gpx(g,9,7,'e');
  gpx(g,9,5,'B');
  // snout pointing right
  grect(g,11,7,3,2,'K'); gpx(g,13,8,'N');
  // small chubby body
  grect(g,3,9,10,4,'K');
  grect(g,4,10,8,2,'W');
  // stubby legs (alternate stride)
  if (strideA){
    grect(g,4,13,2,2,'B'); grect(g,10,13,2,2,'K');
    grect(g,7,13,2,2,'K'); grect(g,12,13,1,2,'B');
  } else {
    grect(g,4,13,2,2,'K'); grect(g,10,13,2,2,'B');
    grect(g,7,13,2,2,'B'); grect(g,12,13,1,2,'K');
  }
  return gRows(g);
}
const ROKI_SIDE_0 = rokiSideGrid(false);
const ROKI_SIDE_1 = rokiSideGrid(true);

function buildRokiSet(){
  return {
    down: [spr(ROKI_DOWN_0,P_ROKI), spr(ROKI_DOWN_1,P_ROKI)],
    up: [spr(ROKI_UP_0,P_ROKI), spr(ROKI_UP_1,P_ROKI)],
    side: [spr(ROKI_SIDE_0,P_ROKI), spr(ROKI_SIDE_1,P_ROKI)]
  };
}

/* =========================================================
   HUMAN NPC SPRITES (generic 16x16, front-facing walk)
========================================================= */
function humanSprite(skin, hair, shirt, pants){
  const pal = { '.':null, 'H': hx(hair), 'S': hx(skin), 'C': hx(shirt), 'c': shade(shirt,0.8),
    'P': hx(pants), 'p': shade(pants,0.8), 'E': hx('#1c1c1c'), 'W': hx('#ffffff') };
  const f0 = [
  "................",
  "....HHHHHH......",
  "...HHHHHHHH.....",
  "...HSSSSSSH.....",
  "...SSEsSEsS.....",
  "...SSSSSSSS.....",
  "....SSSSSS......",
  "...CCCCCCCC.....",
  "..CCCCCCCCCC....",
  "..CCCSSSSCCC....",
  "..CCCCCCCCCC....",
  "...PPP..PPP.....",
  "...PPP..PPP.....",
  "...PP....PP.....",
  "..WW......WW....",
  "................"];
  const f1 = f0.map(r=>r); // reuse; walk handled via bob in draw
  pal['s'] = hx('#1c1c1c');
  return { down:[spr(fixEye(f0),pal), spr(fixEye(f0),pal)], up:[spr(f0.map(r=>r.replace(/E.E./,'HHHH')),pal),spr(f0.map(r=>r.replace(/E.E./,'HHHH')),pal)],
           side:[spr(fixEye(f0),pal), spr(fixEye(f0),pal)] };
}
function fixEye(rows){ return rows.map(r=>r.replace('E','E')); }
function shade(hexcol, mul){
  const c = hx(hexcol);
  return [Math.floor(c[0]*mul), Math.floor(c[1]*mul), Math.floor(c[2]*mul), 255];
}

/* =========================================================
   MAP GENERATION
========================================================= */
let mapTiles = []; // [row][col] -> tile id
let solid = [];    // [row][col] -> bool
let buildings = []; // {x,y,w,h,wall,roof,label}
let props = [];     // trees, bed, ball, treat, signs (world px positions)
let HOME_DOOR = null; // {tx,ty} tile coords of the walkable doorway into home

/* =========================================================
   INDOOR (HOME INTERIOR) SCENE
========================================================= */
const INDOOR_W = VIEW_TILES_X, INDOOR_H = VIEW_TILES_Y; // room fits the screen exactly, no scrolling
let scene = 'outside'; // 'outside' | 'inside'
let indoorSolid = [];
let indoorProps = [];
const INDOOR_ENTRY = { x: 4.5*TILE, y: 6*TILE };
const INDOOR_DOOR_TILE = { tx: 4, ty: 8 };

function generateIndoor(){
  indoorSolid = new Array(INDOOR_H);
  for (let r=0;r<INDOOR_H;r++) indoorSolid[r] = new Array(INDOOR_W).fill(false);
  // walls around the room
  for (let c=0;c<INDOOR_W;c++){ indoorSolid[0][c]=true; indoorSolid[INDOOR_H-1][c]=true; }
  for (let r=0;r<INDOOR_H;r++){ indoorSolid[r][0]=true; indoorSolid[r][INDOOR_W-1]=true; }
  // doorway gap at the bottom (walkable exit)
  indoorSolid[INDOOR_H-1][INDOOR_DOOR_TILE.tx] = false;
  indoorSolid[INDOOR_H-1][INDOOR_DOOR_TILE.tx+1] = false;
  // furniture footprints
  indoorSolid[1][1]=true; indoorSolid[1][2]=true; indoorSolid[2][1]=true; indoorSolid[2][2]=true; // bed
  indoorSolid[1][7]=true; indoorSolid[1][8]=true; // TV
  indoorSolid[6][8]=true; // plant

  indoorProps = [
    { type:'bed', x:1.5*TILE, y:2*TILE+6 },
    { type:'tv', x:7.5*TILE, y:1*TILE+8 },
    { type:'bowl', x:7*TILE, y:6*TILE+6 },
    { type:'plant', x:8*TILE+4, y:6*TILE+10 }
  ];
}

function enterHome(){
  scene = 'inside';
  Roki.x = INDOOR_ENTRY.x - Roki.w/2; Roki.y = INDOOR_ENTRY.y - Roki.h/2;
  Audio8.sfx('select');
}
function exitHome(){
  scene = 'outside';
  Roki.x = HOME_DOOR.tx*TILE - 2; Roki.y = (HOME_DOOR.ty+1)*TILE + 2;
  Audio8.sfx('select');
}

function inRect(c,r,rect){ return c>=rect.x && c<rect.x+rect.w && r>=rect.y && r<rect.y+rect.h; }

function generateMap(){
  mapTiles = new Array(MAP_H);
  solid = new Array(MAP_H);
  for (let r=0;r<MAP_H;r++){
    mapTiles[r] = new Array(MAP_W).fill(T.LAWN);
    solid[r] = new Array(MAP_W).fill(false);
  }

  const SHATTUCK = 20; // vertical divider col (road at 20-21)
  const isPark = (c) => c >= 22;

  // base fill
  for (let r=0;r<MAP_H;r++){
    for (let c=0;c<MAP_W;c++){
      mapTiles[r][c] = isPark(c) ? (((r+c)%5===0)?T.GRASS2:T.GRASS) : (((r+c)%7===0)?T.LAWN:T.GRASS2);
    }
  }

  function hRoad(r0, c0, c1){
    for (let r=r0;r<r0+2;r++) for (let c=c0;c<=c1;c++){ mapTiles[r][c] = (r===r0)? T.ROAD_LINE : T.ROAD; }
  }
  function vRoad(c0, r0, r1){
    for (let c=c0;c<c0+2;c++) for (let r=r0;r<=r1;r++){ mapTiles[r][c] = (c===c0)? T.ROAD : T.ROAD_LINE; }
  }

  // Horizontal roads (full width)
  hRoad(0, 0, MAP_W-1);      // 62nd St (top edge)
  hRoad(10, 0, MAP_W-1);     // Poirier St / 61st St
  hRoad(30, 0, MAP_W-1);     // 59th St (park south edge)
  // west-only
  hRoad(19, 0, 20);          // 60th St

  // Vertical roads
  vRoad(SHATTUCK, 0, MAP_H-1); // Shattuck Ave (full)
  vRoad(4, 0, 30);             // Dover St
  vRoad(12, 0, 30);            // Whitney St
  vRoad(40, 0, 31);            // Racine St
  vRoad(46, 0, MAP_H-1);       // Telegraph Ave

  // sidewalk fringe next to roads (purely cosmetic, walkable)
  function fringe(r,c){ if (r>=0&&r<MAP_H&&c>=0&&c<MAP_W && mapTiles[r][c]!==T.ROAD && mapTiles[r][c]!==T.ROAD_LINE) { if(Math.random()<1) mapTiles[r][c]=T.SIDEWALK; } }

  function addBuilding(x,y,w,h,wall,roof,label,hasDoor){
    buildings.push({x,y,w,h,wall,roof,label});
    for (let r=y;r<y+h;r++){
      for (let c=x;c<x+w;c++){
        if (r<0||r>=MAP_H||c<0||c>=MAP_W) continue;
        mapTiles[r][c] = (r===y) ? T.ROOF : T.WALL;
        solid[r][c] = true;
      }
    }
    if (hasDoor){
      // two tiles wide so walking up into it isn't a pixel-perfect ordeal
      const doorC = x + Math.floor(w/2) - 1, doorR = y+h-1;
      solid[doorR][doorC] = false;
      solid[doorR][doorC+1] = false;
      return { tx: doorC, ty: doorR, tw: 2 };
    }
  }

  // ---- Neighborhood buildings ----
  HOME_DOOR = addBuilding(6,2,3,3,'#dfe7ee','#3a6ea5','HOME', true); // Roki's home (blue roof, matches map pin)
  addBuilding(0,2,3,3,'#b9b9b9','#c97a2e','CONSTRUCTION');    // construction site, top-left
  addBuilding(15,2,4,3,'#e3cf8f','#7a4a2e','ROW HOUSES');
  addBuilding(14,12,5,4,'#e0b98a','#7a3b2e','SHEWHAT CAFE');  // restaurant
  addBuilding(0,12,3,3,'#e3cf8f','#5a5a5a','ROW HOUSES');
  addBuilding(6,12,5,3,'#d9c1a3','#6b4a2e','ROW HOUSES');
  addBuilding(0,21,3,4,'#e3cf8f','#7a4a2e','ROW HOUSES');
  addBuilding(6,21,5,4,'#d9c1a3','#5a5a5a','ROW HOUSES');
  addBuilding(14,21,5,4,'#e0b98a','#6b4a2e','ROW HOUSES');

  // ---- East side buildings ----
  addBuilding(42,2,5,3,'#e6d27a','#3a3a3a','ME VA CON');       // Vietnamese kitchen, top right

/* =========================================================
   AUDIO ENGINE - procedural GB/GBC-style chiptune
========================================================= */
const Audio8 = (function(){
  let ctx = null, master = null, muted = false, started = false, loopTimer = null;
  const NOTE = {
    'C3':130.81,'D3':146.83,'E3':164.81,'F3':174.61,'G3':196.00,'A3':220.00,'B3':246.94,
    'C4':261.63,'D4':293.66,'E4':329.63,'F4':349.23,'G4':392.00,'A4':440.00,'B4':493.88,
    'C5':523.25,'D5':587.33,'E5':659.25,'F5':698.46,'G5':783.99,'A5':880.00,'B5':987.77,
    'C6':1046.50, 'D6':1174.66, 'E6': 1318.51
  };
  function freq(n){ return NOTE[n] || 0; }

  function ensure(){
    if (!ctx){
      ctx = new (window.AudioContext||window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.35; master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function tone(freqHz, t, dur, type, gain, sweep){
    if (muted || !freqHz) return;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freqHz, t);
    if (sweep) osc.frequency.exponentialRampToValueAtTime(Math.max(20,freqHz*sweep), t+dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain||0.18, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t+dur+0.02);
  }
  function noiseBurst(t, dur, gain){
    if (muted) return;
    const bufSize = ctx.sampleRate*dur;
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufSize);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const g = ctx.createGain(); g.gain.value = gain||0.2;
    src.connect(g); g.connect(master);
    src.start(t);
  }

  // Original cheerful town-theme style loop (major key, bouncy)
  const BEAT = 60/152; // seconds per beat
  const melody = [
    ['E5',1],['G5',1],['C6',1],['G5',1], ['E5',1],['D5',1],['C5',2],
    ['D5',1],['F5',1],['A5',1],['F5',1], ['D5',1],['C5',1],['B4',2],
    ['C5',1],['E5',1],['G5',1],['E5',1], ['C5',1],['D5',1],['E5',2],
    ['G5',1],['F5',1],['E5',1],['D5',1], ['C5',1],['B4',1],['C5',2]
  ];
  const bass = [
    ['C4',2],['G3',2], ['A3',2],['E3',2],
    ['F3',2],['C4',2], ['G3',2],['G3',2],
    ['C4',2],['G3',2], ['A3',2],['E3',2],
    ['F3',2],['G3',2], ['C4',2],['C4',2]
  ];

  function scheduleLoop(){
    if (!ctx || muted){ loopTimer = setTimeout(scheduleLoop, 400); return; }
    const start = ctx.currentTime + 0.05;
    let t = start;
    melody.forEach(([n,beats])=>{
      const dur = beats*BEAT*0.92;
      tone(freq(n), t, dur, 'square', 0.10);
      t += beats*BEAT;
    });
    let totalMel = t - start;
    t = start;
    bass.forEach(([n,beats])=>{
      const dur = beats*BEAT*0.9;
      tone(freq(n), t, dur, 'triangle', 0.14);
      t += beats*BEAT;
    });
    // light hats
    let th = start;
    for (let i=0;i<32;i++){ noiseBurst(th, 0.03, 0.02); th += BEAT/1.0; }
    loopTimer = setTimeout(scheduleLoop, totalMel*1000 - 40);
  }

  function start(){
    ensure();
    if (started) return;
    started = true;
    scheduleLoop();
  }
  function setMuted(m){
    muted = m;
    if (master) master.gain.value = m ? 0 : 0.35;
  }
  function sfx(name){
    ensure();
    const t = ctx.currentTime;
    switch(name){
      case 'greet': tone(freq('C5'),t,0.09,'square',0.16); tone(freq('E5'),t+0.09,0.12,'square',0.16); break;
      case 'pet': tone(freq('G5'),t,0.08,'triangle',0.15); tone(freq('C6'),t+0.07,0.14,'triangle',0.15); break;
      case 'squirrel': tone(freq('E5'),t,0.05,'square',0.14); tone(freq('G5'),t+0.05,0.05,'square',0.14); tone(freq('C6'),t+0.10,0.1,'square',0.14); break;
      case 'treat': tone(freq('C5'),t,0.06,'square',0.16); tone(freq('E5'),t+0.06,0.06,'square',0.16); tone(freq('G5'),t+0.12,0.06,'square',0.16); tone(freq('C6'),t+0.18,0.16,'square',0.16); break;
      case 'nap': tone(freq('G4'),t,0.25,'sine',0.1,0.8); break;
      case 'park': tone(freq('C5'),t,0.1,'square',0.15); tone(freq('F5'),t+0.1,0.1,'square',0.15); tone(freq('A5'),t+0.2,0.18,'square',0.15); break;
      case 'sniff': tone(freq('A3'),t,0.08,'square',0.1); break;
      case 'owner': tone(freq('E5'),t,0.08,'triangle',0.16); tone(freq('A5'),t+0.08,0.08,'triangle',0.16); tone(freq('C6'),t+0.16,0.16,'triangle',0.16); break;
      case 'hit': noiseBurst(t,0.18,0.28); tone(freq('C3'),t,0.15,'sawtooth',0.16); break;
      case 'select': tone(freq('C5'),t,0.05,'square',0.12); break;
      case 'bark':
        tone(freq('A4'),t,0.09,'square',0.24,0.55);
        tone(freq('E4'),t+0.1,0.08,'square',0.2,0.55);
        break;
      case 'victory':
        ['C5','E5','G5','C6','G5','C6','E6'].forEach((n,i)=>tone(freq(n), t+i*0.14, 0.18,'square',0.18));
        break;
    }
  }
  return { start, setMuted, sfx, get muted(){return muted;} };
})();

  collie = { x:30*TILE+8, y:15*TILE+8, hx0:30*TILE+8, hy0:15*TILE+8, state:'idle', dir:'down', t:0, angryT:0, spookedT:0 };

  cake = { x:17*TILE, y:17*TILE, hx0:17*TILE, hy0:17*TILE, dir:'down', t:Math.random()*2, tx:17*TILE, ty:17*TILE, fleeing:false, caught:false, respawnT:0 };

  crow = { x:34*TILE, y:11*TILE, dir:'down', hopT:1+Math.random(), frame:0, befriended:false };

function mkWanderer(x,y,img,radius,homeR, isHuman){
  return { x,y, hx0:x, hy0:y, img, dir:'down', frame:0, animT:0, radius, t: Math.random()*3, tx:x, ty:y, greeted:false, isHuman };

function mkSquirrel(x,y){

function mkGuard(x,y, zx,zy,zw,zh){
  return { x,y, dir:'down', state:'patrol', t:0, tx:x, ty:y, zone:{x:zx,y:zy,w:zw,h:zh}, angryT:0, frame:0, spookedT:0 };

/* =========================================================
   COLLISION HELPERS
========================================================= */
function tileSolidAtPixel(px,py){
  const c = Math.floor(px/TILE), r = Math.floor(py/TILE);
  if (r<0||r>=MAP_H||c<0||c>=MAP_W) return true;
  return solid[r][c];
}
function indoorTileSolidAtPixel(px,py){
  const c = Math.floor(px/TILE), r = Math.floor(py/TILE);
  if (r<0||r>=INDOOR_H||c<0||c>=INDOOR_W) return true;
  return indoorSolid[r][c];
}
function rectHitsSolid(x,y,w,h){
  const pts = [[x,y],[x+w,y],[x,y+h],[x+w,y+h],[x+w/2,y+h]];
  if (scene === 'inside'){
    for (const [px,py] of pts) if (indoorTileSolidAtPixel(px,py)) return true;
    return false;
  }
  for (const [px,py] of pts) if (tileSolidAtPixel(px,py)) return true;
  // tree collisions (small circles)
  for (const p of props){
    if (p.type !== 'tree') continue;
    const cx = x+w/2, cy = y+h;
    const dx = cx-p.x, dy = cy-p.y;
    if (dx*dx+dy*dy < (p.r+3)*(p.r+3)) return true;
  }
  return false;
}
function clampWorld(x,y,w,h){
  if (scene === 'inside'){
    return { x: Math.max(0, Math.min(INDOOR_W*TILE-w, x)), y: Math.max(0, Math.min(INDOOR_H*TILE-h, y)) };
  }
  return { x: Math.max(0, Math.min(WORLD_W-w, x)), y: Math.max(0, Math.min(WORLD_H-h, y)) };
}
function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

/* =========================================================
   INTERACTION LOGIC
========================================================= */
function dist(x1,y1,x2,y2){ const dx=x1-x2, dy=y1-y2; return Math.sqrt(dx*dx+dy*dy); }
function rokiCenter(){ return { x: Roki.x+Roki.w/2, y: Roki.y+Roki.h/2 }; }

function tryInteract(){
  const rc = rokiCenter();
  const REACH = 16;
  const candidates = [];

  if (scene === 'inside'){
    for (const p of indoorProps){
      if (p.type==='bed'){
        candidates.push({ d: dist(rc.x,rc.y,p.x,p.y), reach: REACH+4, run: () => {
          happiness.napped = true;
          Audio8.sfx('nap'); say("Roki curls up in his bed. Zzz... cozy nap!");
        }});
      }
      if (p.type==='tv'){
        candidates.push({ d: dist(rc.x,rc.y,p.x,p.y), reach: REACH, run: () => {
          Audio8.sfx('select'); say("It's playing Roki's favorite show about squirrels.");
        }});
      }
      if (p.type==='plant'){
        candidates.push({ d: dist(rc.x,rc.y,p.x,p.y), reach: REACH, run: () => {
          Audio8.sfx('sniff'); say('Roki sniffs the houseplant. Smells... green.');
        }});
      }
      if (p.type==='bowl'){
        candidates.push({ d: dist(rc.x,rc.y,p.x,p.y), reach: REACH, run: () => {
          Audio8.sfx('select'); say("Roki's food bowl. All licked clean already.");
        }});
      }
    }
    const inReach0 = candidates.filter(c => c.d < c.reach);
    if (!inReach0.length) return;
    inReach0.sort((a,b)=>a.d-b.d);
    inReach0[0].run();
    return;
  }

  // Gather every candidate interactable within reach, then act on the CLOSEST
  // one only (fixes cases where props sit near each other, e.g. the bed by John).
  candidates.push({ d: dist(rc.x,rc.y, john.x+8, john.y+8), reach: REACH, run: () => {
    happiness.greetedJohn = true;
    Audio8.sfx('owner'); say('John grins. "Hey Roki, good boy!"');
    checkOwnersComplete();
  }});
  candidates.push({ d: dist(rc.x,rc.y, alice.x+8, alice.y+8), reach: REACH, run: () => {
    happiness.greetedAlice = true;
    Audio8.sfx('owner'); say('Alice scratches behind Roki\'s ears.');
    checkOwnersComplete();
  }});
  for (const d of dogs){
    candidates.push({ d: dist(rc.x,rc.y,d.x+8,d.y+8), reach: REACH, run: () => {
      happiness.greetedDog = true;
      Audio8.sfx('greet'); say('Roki and the other dog sniff and wag hello!');
    }});
  }
  for (const s of strangers){
    candidates.push({ d: dist(rc.x,rc.y,s.x+8,s.y+8), reach: REACH, run: () => {
      happiness.gotPet = true;
      Audio8.sfx('pet'); say('"Who\'s a good boy?" *pets*');
    }});
  }
  if (crow && !crow.befriended){
    candidates.push({ d: dist(rc.x,rc.y,crow.x+8,crow.y+8), reach: REACH, run: () => {
      crow.befriended = true; challenges.befriendedCrow = true;
      Audio8.sfx('greet'); say('Caw! The crow hops closer. New friend!');
      checkChallengesComplete();
    }});
  }
  for (const p of props){
    if (p.type==='treat' && !p.taken){
      candidates.push({ d: dist(rc.x,rc.y,p.x,p.y), reach: REACH, run: () => {
        p.taken = true; happiness.gotTreat = true;
        Audio8.sfx('treat'); say('Roki gobbles up the treat. Yum!');
      }});
    }
    if (p.type==='tree'){
      candidates.push({ d: dist(rc.x,rc.y,p.x,p.y), reach: REACH, run: () => {
        happiness.sniffedTree = true;
        Audio8.sfx('sniff'); say('Sniff sniff... an important smell.');
      }});
    }
  }

  const inReach = candidates.filter(c => c.d < c.reach);
  if (!inReach.length) return;
  inReach.sort((a,b)=>a.d-b.d);
  inReach[0].run();
}
function checkOwnersComplete(){
  if (happiness.greetedJohn && happiness.greetedAlice){
    say('Family time! Roki is surrounded by love.');
  }
}
function checkChallengesComplete(){
  if (challenges.chasedCake && challenges.scaredCoyote && challenges.befriendedCrow && !challenges.allDone){
    challenges.allDone = true;
    Audio8.sfx('victory');
    say('All bonus challenges complete! Roki is a neighborhood legend.');
  }
}

/* =========================================================
   UPDATE
========================================================= */
let lastT = 0;
function update(dt){
  if (gameState !== 'playing') return;

  // --- Roki movement ---
  let mvx = 0, mvy = 0;
  if (Keys.up) mvy -= 1;
  if (Keys.down) mvy += 1;
  if (Keys.left) mvx -= 1;
  if (Keys.right) mvx += 1;
  const moving = mvx !== 0 || mvy !== 0;
  if (moving){
    const len = Math.hypot(mvx,mvy) || 1;
    mvx/=len; mvy/=len;
    if (Math.abs(mvx) > Math.abs(mvy)) Roki.dir = mvx>0?'right':'left';
    else if (mvy !== 0) Roki.dir = mvy>0?'down':'up';
  }
  Roki.moving = moving;
  const dx = mvx*Roki.speed*dt, dy = mvy*Roki.speed*dt;
  let nx = Roki.x + dx, ny = Roki.y;
  if (!rectHitsSolid(nx, ny, Roki.w, Roki.h)) Roki.x = nx;
  nx = Roki.x; ny = Roki.y + dy;
  if (!rectHitsSolid(nx, ny, Roki.w, Roki.h)) Roki.y = ny;
  const cl = clampWorld(Roki.x, Roki.y, Roki.w, Roki.h);
  Roki.x = cl.x; Roki.y = cl.y;

  if (moving){ Roki.animT += dt; if (Roki.animT > 0.18){ Roki.animT = 0; Roki.frame = 1-Roki.frame; } }
  else { Roki.frame = 0; }

  if (Roki.invT > 0) Roki.invT -= dt;
  if (Roki.barkT > 0) Roki.barkT -= dt;

  // door transitions
  if (scene === 'outside' && HOME_DOOR){
    const dx0 = HOME_DOOR.tx*TILE, dy0 = HOME_DOOR.ty*TILE;
    if (rectsOverlap(Roki.x,Roki.y,Roki.w,Roki.h, dx0,dy0,TILE*(HOME_DOOR.tw||1),TILE)) enterHome();
  } else if (scene === 'inside'){
    const dx0 = INDOOR_DOOR_TILE.tx*TILE, dy0 = INDOOR_DOOR_TILE.ty*TILE;
    if (rectsOverlap(Roki.x,Roki.y,Roki.w,Roki.h, dx0,dy0,TILE*2,TILE)) exitHome();
  }

  // park visit check
  if (scene==='outside' && Math.floor(Roki.x/TILE) >= 22 && !happiness.visitedPark){
    happiness.visitedPark = true;
    Audio8.sfx('park'); say('Welcome to Bushrod Park!');
  }

  if (scene === 'outside'){
    updateWanderers(dogs, dt, 42);
    updateWanderers(strangers, dt, 34);
    updateSquirrels(dt);
    updateOwner(john, dt);
    updateOwner(alice, dt);
    updateShepherds(dt);
    updateCollie(dt);
    updateCake(dt);
    updateCoyote(dt);
    updateCrow(dt);
  }

  for (const p of popups){ p.t += dt; }
  popups = popups.filter(p=>p.t < p.life);

  if (dialogue.active){
    dialogue.t += dt;
    if (dialogue.t >= dialogue.life) dialogue.active = false;
  }

  if (happinessPercent() >= 100 && gameState==='playing'){ showVictory(); }
}

function updateWanderers(list, dt, speed){
  for (const w of list){
    w.t -= dt;
    if (w.t <= 0){
      w.t = 1.4 + Math.random()*2.2;
      const ang = Math.random()*Math.PI*2;
      const rad = Math.random()*w.radius;
      let tx = w.hx0 + Math.cos(ang)*rad;
      let ty = w.hy0 + Math.sin(ang)*rad;
      w.tx = tx; w.ty = ty;
    }
    const ddx = w.tx-w.x, ddy = w.ty-w.y;
    const d = Math.hypot(ddx,ddy);
    if (d > 2){
      const vx = ddx/d*speed*dt, vy = ddy/d*speed*dt;
      const nx = w.x+vx, ny = w.y+vy;
      if (!rectHitsSolid(nx,w.y,10,10)) w.x = nx;
      if (!rectHitsSolid(w.x,ny,10,10)) w.y = ny;
      w.dir = Math.abs(vx)>Math.abs(vy) ? (vx>0?'right':'left') : (vy>0?'down':'up');
      w.animT = (w.animT||0) + dt; if (w.animT>0.2){ w.animT=0; w.frame = 1-(w.frame||0); }
    }
  }
}
function updateOwner(o, dt){
  o.wanderT -= dt;
  if (o.wanderT <= 0){ o.wanderT = 2+Math.random()*2; }
}
function updateSquirrels(dt){
  const rc = rokiCenter();
  for (const s of squirrels){
    if (s.caught){
      s.respawnT -= dt;
      if (s.respawnT <= 0){ s.caught=false; s.x=s.hx0; s.y=s.hy0; }
      continue;
    }
    const dToRoki = dist(rc.x,rc.y,s.x+6,s.y+6);
    if (dToRoki < 48){
      s.fleeing = true;
      const ang = Math.atan2(s.y-rc.y, s.x-rc.x);
      const speed = 58;
      const nx = s.x + Math.cos(ang)*speed*dt, ny = s.y + Math.sin(ang)*speed*dt;
      const cl = clampWorld(nx,ny,10,10);
      if (!rectHitsSolid(cl.x,s.y,10,10)) s.x = cl.x;
      if (!rectHitsSolid(s.x,cl.y,10,10)) s.y = cl.y;
      s.dir = Math.abs(Math.cos(ang))>Math.abs(Math.sin(ang)) ? (Math.cos(ang)>0?'right':'left') : (Math.sin(ang)>0?'down':'up');
    } else {
      s.fleeing = false;
      s.t -= dt;
      if (s.t <= 0){ s.t = 1+Math.random()*2; s.tx = s.hx0+(Math.random()*40-20); s.ty = s.hy0+(Math.random()*40-20); }
      const ddx=s.tx-s.x, ddy=s.ty-s.y, d=Math.hypot(ddx,ddy);
      if (d>2){ s.x += ddx/d*20*dt; s.y += ddy/d*20*dt; }
    }
    if (dToRoki < 12 && !s.caught){
      s.caught = true; s.respawnT = 5;
      happiness.chasedSquirrel = true;
      Audio8.sfx('squirrel'); popup(s.x,s.y,'Gotcha! (sort of)','#ffd23f');
    }
  }
}
function updateShepherds(dt){
  const rc = rokiCenter();
  for (const g of shepherds){
    const dToRoki = dist(rc.x,rc.y,g.x+8,g.y+8);
    if (g.spookedT > 0){
      g.spookedT -= dt;
      g.state = 'spooked';
      const ang = Math.atan2(g.y-rc.y, g.x-rc.x);
      const speed = 70;
      let nx = g.x+Math.cos(ang)*speed*dt, ny = g.y+Math.sin(ang)*speed*dt;
      if (!rectHitsSolid(nx,g.y,12,10)) g.x = nx;
      if (!rectHitsSolid(g.x,ny,12,10)) g.y = ny;
      g.dir = Math.abs(Math.cos(ang))>Math.abs(Math.sin(ang)) ? (Math.cos(ang)>0?'right':'left') : (Math.sin(ang)>0?'down':'up');
      g.animT = (g.animT||0)+dt; if (g.animT>0.15){g.animT=0; g.frame=1-(g.frame||0);}
      continue;
    }
    const alert = dToRoki < 46;
    if (alert){
      g.state = 'chase';
      const ang = Math.atan2(rc.y-g.y, rc.x-g.x);
      const speed = 60;
      let nx = g.x+Math.cos(ang)*speed*dt, ny = g.y+Math.sin(ang)*speed*dt;
      if (!rectHitsSolid(nx,g.y,12,10)) g.x = nx;
      if (!rectHitsSolid(g.x,ny,12,10)) g.y = ny;
      g.dir = Math.abs(Math.cos(ang))>Math.abs(Math.sin(ang)) ? (Math.cos(ang)>0?'right':'left') : (Math.sin(ang)>0?'down':'up');
    } else {
      g.state = 'patrol';
      g.t -= dt;
      if (g.t <= 0){
        g.t = 1.5+Math.random()*2;
        g.tx = g.zone.x + Math.random()*g.zone.w;
        g.ty = g.zone.y + Math.random()*g.zone.h;
      }
      const ddx=g.tx-g.x, ddy=g.ty-g.y, d=Math.hypot(ddx,ddy);
      if (d>2){
        const vx=ddx/d*24*dt, vy=ddy/d*24*dt;
        const nx=g.x+vx, ny=g.y+vy;
        if (!rectHitsSolid(nx,g.y,12,10)) g.x=nx;
        if (!rectHitsSolid(g.x,ny,12,10)) g.y=ny;
        g.dir = Math.abs(vx)>Math.abs(vy) ? (vx>0?'right':'left') : (vy>0?'down':'up');
      }
    }
    g.animT = (g.animT||0)+dt; if (g.animT>0.15){g.animT=0; g.frame=1-(g.frame||0);}
    if (dToRoki < 11 && Roki.invT<=0){ hitRoki(g.x,g.y); }
  }
}
function updateCollie(dt){
  const rc = rokiCenter();
  const c = collie;
  const dToBall = dist(rc.x,rc.y, 30*TILE+8, 15*TILE+8);
  const dToCollie = dist(rc.x,rc.y,c.x+8,c.y+8);
  if (c.spookedT > 0){
    c.spookedT -= dt;
    c.state = 'spooked';
    const ang = Math.atan2(c.y-rc.y, c.x-rc.x);
    const speed = 70;
    let nx=c.x+Math.cos(ang)*speed*dt, ny=c.y+Math.sin(ang)*speed*dt;
    if (!rectHitsSolid(nx,c.y,12,10)) c.x=nx;
    if (!rectHitsSolid(c.x,ny,12,10)) c.y=ny;
    c.dir = Math.abs(Math.cos(ang))>Math.abs(Math.sin(ang)) ? (Math.cos(ang)>0?'right':'left') : (Math.sin(ang)>0?'down':'up');
    return;
  }
  if (dToBall < 40){
    c.state = 'angry';
    const ang = Math.atan2(rc.y-c.y, rc.x-c.x);
    const speed = 66;
    let nx=c.x+Math.cos(ang)*speed*dt, ny=c.y+Math.sin(ang)*speed*dt;
    if (!rectHitsSolid(nx,c.y,12,10)) c.x=nx;
    if (!rectHitsSolid(c.x,ny,12,10)) c.y=ny;
    c.dir = Math.abs(Math.cos(ang))>Math.abs(Math.sin(ang)) ? (Math.cos(ang)>0?'right':'left') : (Math.sin(ang)>0?'down':'up');
  } else {
    c.state = 'idle';
    const ddx=c.hx0-c.x, ddy=c.hy0-c.y, d=Math.hypot(ddx,ddy);
    if (d>2){ c.x += ddx/d*20*dt; c.y += ddy/d*20*dt; }
  }
  if (dToCollie < 11 && Roki.invT<=0){ hitRoki(c.x,c.y); }
}
function hitRoki(sx,sy){
  Roki.hearts -= 1;
  Roki.invT = 1.4;
  Audio8.sfx('hit');
  popup(Roki.x,Roki.y-4,'Yipe!','#ff6b6b');
  const rc = rokiCenter();
  const ang = Math.atan2(rc.y-sy, rc.x-sx);
  const push = 22;
  const nx = clampWorld(Roki.x+Math.cos(ang)*push, Roki.y+Math.sin(ang)*push, Roki.w, Roki.h);
  if (!rectHitsSolid(nx.x, Roki.y, Roki.w, Roki.h)) Roki.x = nx.x;
  if (!rectHitsSolid(Roki.x, nx.y, Roki.w, Roki.h)) Roki.y = nx.y;
  if (Roki.hearts <= 0){
    Roki.hearts = Roki.maxHearts;
    Roki.x = 8*TILE; Roki.y = 5*TILE;
    popup(Roki.x,Roki.y-10,'Ran home to safety!','#8fd6ff');
  }
}

// --- Challenge entities: runaway cake, coyote, crow ---
function updateCake(dt){
  if (!cake) return;
  if (cake.caught){
    cake.respawnT -= dt;
    if (cake.respawnT <= 0){ cake.caught=false; cake.x=cake.hx0; cake.y=cake.hy0; }
    return;
  }
  const rc = rokiCenter();
  const dToRoki = dist(rc.x,rc.y,cake.x+6,cake.y+6);
  if (dToRoki < 46){
    cake.fleeing = true;
    const ang = Math.atan2(cake.y-rc.y, cake.x-rc.x);
    const speed = 56;
    const nx = cake.x + Math.cos(ang)*speed*dt, ny = cake.y + Math.sin(ang)*speed*dt;
    const cl = clampWorld(nx,ny,10,10);
    if (!rectHitsSolid(cl.x,cake.y,10,10)) cake.x = cl.x;
    if (!rectHitsSolid(cake.x,cl.y,10,10)) cake.y = cl.y;
  } else {
    cake.fleeing = false;
    cake.t -= dt;
    if (cake.t <= 0){ cake.t = 1+Math.random()*2; cake.tx = cake.hx0+(Math.random()*40-20); cake.ty = cake.hy0+(Math.random()*40-20); }
    const ddx=cake.tx-cake.x, ddy=cake.ty-cake.y, d=Math.hypot(ddx,ddy);
    if (d>2){ cake.x += ddx/d*18*dt; cake.y += ddy/d*18*dt; }
  }
  if (dToRoki < 12 && !cake.caught){
    cake.caught = true; cake.respawnT = 6;
    challenges.chasedCake = true;
    Audio8.sfx('treat'); say('You caught the cake! Frosting everywhere.');
    checkChallengesComplete();
  }
}
function updateCoyote(dt){
  if (!coyote) return;
  const rc = rokiCenter();
  const dToRoki = dist(rc.x,rc.y,coyote.x+8,coyote.y+8);
  if (coyote.spookedT > 0){
    coyote.spookedT -= dt;
    coyote.state = 'spooked';
    const ang = Math.atan2(coyote.y-rc.y, coyote.x-rc.x);
    const speed = 76;
    let nx=coyote.x+Math.cos(ang)*speed*dt, ny=coyote.y+Math.sin(ang)*speed*dt;
    if (!rectHitsSolid(nx,coyote.y,12,10)) coyote.x=nx;
    if (!rectHitsSolid(coyote.x,ny,12,10)) coyote.y=ny;
    coyote.dir = Math.abs(Math.cos(ang))>Math.abs(Math.sin(ang)) ? (Math.cos(ang)>0?'right':'left') : (Math.sin(ang)>0?'down':'up');
    return;
  }
  const alert = dToRoki < 38;
  if (alert){
    coyote.state = 'alert';
    const ang = Math.atan2(rc.y-coyote.y, rc.x-coyote.x);
    const speed = 40;
    let nx = coyote.x+Math.cos(ang)*speed*dt, ny = coyote.y+Math.sin(ang)*speed*dt;
    if (!rectHitsSolid(nx,coyote.y,12,10)) coyote.x = nx;
    if (!rectHitsSolid(coyote.x,ny,12,10)) coyote.y = ny;
    coyote.dir = Math.abs(Math.cos(ang))>Math.abs(Math.sin(ang)) ? (Math.cos(ang)>0?'right':'left') : (Math.sin(ang)>0?'down':'up');
  } else {
    coyote.state = 'patrol';
    coyote.t -= dt;
    if (coyote.t <= 0){
      coyote.t = 1.5+Math.random()*2;
      coyote.tx = coyote.zone.x + Math.random()*coyote.zone.w;
      coyote.ty = coyote.zone.y + Math.random()*coyote.zone.h;
    }
    const ddx=coyote.tx-coyote.x, ddy=coyote.ty-coyote.y, d=Math.hypot(ddx,ddy);
    if (d>2){
      const vx=ddx/d*20*dt, vy=ddy/d*20*dt;
      const nx=coyote.x+vx, ny=coyote.y+vy;
      if (!rectHitsSolid(nx,coyote.y,12,10)) coyote.x=nx;
      if (!rectHitsSolid(coyote.x,ny,12,10)) coyote.y=ny;
      coyote.dir = Math.abs(vx)>Math.abs(vy) ? (vx>0?'right':'left') : (vy>0?'down':'up');
    }
  }
  coyote.animT = (coyote.animT||0)+dt; if (coyote.animT>0.15){coyote.animT=0; coyote.frame=1-(coyote.frame||0);}
  if (dToRoki < 11 && Roki.invT<=0){ hitRoki(coyote.x,coyote.y); }
}
function updateCrow(dt){
  if (!crow) return;
  crow.hopT -= dt;
  if (crow.hopT <= 0){ crow.hopT = 1+Math.random()*1.5; crow.frame = 1-(crow.frame||0); }
}

/* =========================================================
   RENDER
========================================================= */
let RokiSprites = null;

function tileColor(id, r, c){
  switch(id){
    case T.GRASS: return PAL.grassA;
    case T.GRASS2: return PAL.grassB;
    case T.LAWN: return ((r+c)%2===0)?PAL.lawnA:PAL.lawnB;
    case T.ROAD: return PAL.roadA;
    case T.ROAD_LINE: return PAL.roadB;
    case T.SIDEWALK: return ((r+c)%2===0)?PAL.sidewalkA:PAL.sidewalkB;
    case T.DIRT: return ((r+c)%2===0)?PAL.dirtA:PAL.dirtB;
    case T.WALL: return '#000';
    case T.ROOF: return '#000';
    default: return PAL.grassA;
  }
}

function draw(){
  if (scene === 'inside') drawIndoor();
  else drawOutside();

  // popups + HUD + dialogue are drawn in shared screen space either way
  const camX = scene==='inside' ? 0 : Math.max(0, Math.min(WORLD_W-VIEW_W, Roki.x+Roki.w/2-VIEW_W/2));
  const camY = scene==='inside' ? 0 : Math.max(0, Math.min(WORLD_H-VIEW_H, Roki.y+Roki.h/2-VIEW_H/2));
  ctx.font = '6px monospace'; ctx.textAlign='center';
  for (const p of popups){
    const alpha = 1 - p.t/p.life;
    ctx.globalAlpha = Math.max(0,alpha);
    ctx.fillStyle = '#000';
    ctx.fillText(p.text, p.x-camX+1, p.y-camY-p.t*10+1);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x-camX, p.y-camY-p.t*10);
    ctx.globalAlpha = 1;
  }

  drawHUD();
  drawDialogueBox();
}

function drawOutside(){
  const camX = Math.max(0, Math.min(WORLD_W-VIEW_W, Roki.x+Roki.w/2-VIEW_W/2));
  const camY = Math.max(0, Math.min(WORLD_H-VIEW_H, Roki.y+Roki.h/2-VIEW_H/2));

  ctx.fillStyle = '#7bc95a';
  ctx.fillRect(0,0,VIEW_W,VIEW_H);

  const c0 = Math.floor(camX/TILE), c1 = Math.ceil((camX+VIEW_W)/TILE);
  const r0 = Math.floor(camY/TILE), r1 = Math.ceil((camY+VIEW_H)/TILE);

  // ground tiles
  for (let r=r0;r<=r1;r++){
    if (r<0||r>=MAP_H) continue;
    for (let c=c0;c<=c1;c++){
      if (c<0||c>=MAP_W) continue;
      const id = mapTiles[r][c];
      if (id===T.WALL || id===T.ROOF) continue;
      ctx.fillStyle = tileColor(id,r,c);
      ctx.fillRect(c*TILE-camX, r*TILE-camY, TILE, TILE);
      if (id===T.ROAD_LINE){
        ctx.fillStyle = PAL.roadLine;
        ctx.fillRect(c*TILE-camX+6, r*TILE-camY+7, 4, 2);
      }
      // route-style dot texture on grass, Pokemon-route inspired
      if (id===T.GRASS || id===T.GRASS2){
        ctx.fillStyle = 'rgba(30,60,20,0.35)';
        const tx = c*TILE-camX, ty = r*TILE-camY;
        if ((r*7+c*3)%4===0) ctx.fillRect(tx+4, ty+4, 1, 1);
        if ((r*5+c*11)%6===0) ctx.fillRect(tx+11, ty+9, 1, 1);
      }
    }
  }

  // buildings
  for (const b of buildings){
    const bx = b.x*TILE-camX, by = b.y*TILE-camY, bw=b.w*TILE, bh=b.h*TILE;
    if (bx+bw<0||bx>VIEW_W||by+bh<0||by>VIEW_H) continue;
    ctx.fillStyle = b.wall;
    ctx.fillRect(bx, by+TILE, bw, bh-TILE);
    ctx.fillStyle = b.roof;
    ctx.fillRect(bx-2, by-2, bw+4, TILE+4);
    // cross-hatched roof texture (Game Boy Pokemon gym/building roofs)
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let lx=bx-2; lx<bx+bw+4; lx+=4){
      ctx.moveTo(lx, by-2); ctx.lineTo(lx-6, by+TILE+2);
    }
    ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(bx, by+TILE, bw, 3);
    // door
    ctx.fillStyle = '#5a3a24';
    ctx.fillRect(bx+bw/2-5, by+bh-12, 10, 12);
    // label
    ctx.fillStyle = '#1b1830';
    ctx.font = '5px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(b.label, bx+bw/2, by-5);
  }

  // sortable sprites: props(trees), dogs, strangers, squirrels, shepherds, collie, john, alice, roki
  const drawables = [];
  for (const p of props){
    if (p.type==='tree') drawables.push({y:p.y, draw:()=>ctx.drawImage(treeImg, p.x-camX-8, p.y-camY-16, 16,16)});
    if (p.type==='ball') drawables.push({y:p.y, draw:()=>ctx.drawImage(ballImg, p.x-camX-8, p.y-camY-8, 16,10)});
    if (p.type==='treat' && !p.taken) drawables.push({y:p.y, draw:()=>ctx.drawImage(treatImg, p.x-camX-8, p.y-camY-8, 16,10)});
    if (p.type==='sign') drawables.push({y:p.y, draw:()=>{
      ctx.fillStyle='#8a5a34'; ctx.fillRect(p.x-camX-1, p.y-camY-6, 2, 10);
      ctx.fillStyle='#e8dcc0'; ctx.fillRect(p.x-camX-14, p.y-camY-14, 28, 10);
      ctx.fillStyle='#3a2a0f'; ctx.font='4px monospace'; ctx.textAlign='center';
      ctx.fillText(p.text, p.x-camX, p.y-camY-7);
    }});
  }
  for (const d of dogs) drawables.push({y:d.y, draw:()=>{
    ctx.save(); if (d.dir==='left'){ ctx.translate((d.x-camX)*2+16,0); ctx.scale(-1,1); }
    ctx.drawImage(d.img, d.dir==='left'?(d.x-camX):(d.x-camX), d.y-camY-2, 16,16); ctx.restore();
  }});
  for (const s of strangers) drawables.push({y:s.y, draw:()=>{
    ctx.drawImage(s.img, s.x-camX, s.y-camY-2, 16,16);
  }});
  for (const s of squirrels){ if (!s.caught) drawables.push({y:s.y, draw:()=>ctx.drawImage(squirrelImg, s.x-camX, s.y-camY-2, 16,16)}); }
  for (const g of shepherds) drawables.push({y:g.y, draw:()=>{
    ctx.save(); if (g.dir==='left'){ ctx.translate((g.x-camX)*2+16,0); ctx.scale(-1,1); }
    ctx.drawImage(shepherdImg, g.x-camX, g.y-camY-2, 16,16); ctx.restore();
    if (g.state==='chase'){ ctx.fillStyle='#ff3b3b'; ctx.font='7px monospace'; ctx.textAlign='center'; ctx.fillText('!', g.x-camX+6, g.y-camY-4); }
  }});
  drawables.push({y:collie.y, draw:()=>{
    ctx.save(); if (collie.dir==='left'){ ctx.translate((collie.x-camX)*2+16,0); ctx.scale(-1,1); }
    ctx.drawImage(collieImg, collie.x-camX, collie.y-camY-2, 16,16); ctx.restore();
    if (collie.state==='angry'){ ctx.fillStyle='#ff3b3b'; ctx.font='7px monospace'; ctx.textAlign='center'; ctx.fillText('!', collie.x-camX+6, collie.y-camY-4); }
  }});
  if (cake && !cake.caught) drawables.push({y:cake.y, draw:()=>ctx.drawImage(cakeImg, cake.x-camX, cake.y-camY-2, 16,16)});
  if (coyote) drawables.push({y:coyote.y, draw:()=>{
    ctx.save(); if (coyote.dir==='left'){ ctx.translate((coyote.x-camX)*2+16,0); ctx.scale(-1,1); }
    ctx.drawImage(coyoteImg, coyote.x-camX, coyote.y-camY-2, 16,16); ctx.restore();
    if (coyote.state==='alert'){ ctx.fillStyle='#ff3b3b'; ctx.font='7px monospace'; ctx.textAlign='center'; ctx.fillText('!', coyote.x-camX+6, coyote.y-camY-4); }
  }});
  if (crow && !crow.befriended) drawables.push({y:crow.y, draw:()=>ctx.drawImage(crowImgs[crow.frame], crow.x-camX, crow.y-camY-2, 16,16)});
  drawables.push({y:john.y, draw:()=>ctx.drawImage(john.img, john.x-camX, john.y-camY-2, 16,16)});
  drawables.push({y:alice.y, draw:()=>ctx.drawImage(alice.img, alice.x-camX, alice.y-camY-2, 16,16)});

  // roki
  const rokiKey = (Roki.dir==='left'||Roki.dir==='right') ? 'side' : Roki.dir;
  const rimg = RokiSprites[rokiKey][Roki.frame];
  drawables.push({y:Roki.y+Roki.h, draw:()=>{
    if (Roki.invT>0 && Math.floor(Roki.invT*10)%2===0) return; // flicker
    ctx.save();
    if (Roki.dir==='left'){ ctx.translate((Roki.x-camX)*2+16,0); ctx.scale(-1,1); }
    ctx.drawImage(rimg, Roki.x-camX-2, Roki.y-camY-4, 16,16);
    ctx.restore();
  }});

  drawables.sort((a,b)=>a.y-b.y);
  for (const d of drawables) d.draw();

  // interaction prompts
  drawInteractPrompts(camX,camY);
}

function drawIndoor(){
  // wood floor
  for (let r=0;r<INDOOR_H;r++){
    for (let c=0;c<INDOOR_W;c++){
      const floorTone = ((r+c)%2===0) ? '#c9a06a' : '#bd9560';
      ctx.fillStyle = indoorSolid[r][c] && (r===0||r===INDOOR_H-1||c===0||c===INDOOR_W-1) ? '#7a5a3a' : floorTone;
      ctx.fillRect(c*TILE, r*TILE, TILE, TILE);
    }
  }
  // wallpaper top border + baseboards
  ctx.fillStyle = '#5a6ea0';
  ctx.fillRect(0,0, INDOOR_W*TILE, TILE);
  ctx.fillStyle = '#465580';
  ctx.fillRect(0,TILE-3, INDOOR_W*TILE, 3);
  // window
  ctx.fillStyle = '#bfe3f0';
  ctx.fillRect(3*TILE+3, 3, TILE*1.2, TILE-8);
  ctx.strokeStyle = '#2a2a34'; ctx.lineWidth=1; ctx.strokeRect(3*TILE+3, 3, TILE*1.2, TILE-8);
  // doorway mat at the exit
  ctx.fillStyle = '#8a5a34';
  ctx.fillRect(INDOOR_DOOR_TILE.tx*TILE, (INDOOR_H-1)*TILE, TILE*2, TILE);
  // rug
  ctx.fillStyle = '#c9435a';
  ctx.fillRect(4*TILE, 4*TILE, 3*TILE, 2*TILE);
  ctx.fillStyle = '#a83348';
  ctx.strokeStyle = '#a83348'; ctx.strokeRect(4*TILE+2, 4*TILE+2, 3*TILE-4, 2*TILE-4);

  const drawables = [];
  for (const p of indoorProps){
    if (p.type==='bed') drawables.push({y:p.y, draw:()=>ctx.drawImage(bedImg, p.x-8, p.y-4, 20,14)});
    if (p.type==='tv') drawables.push({y:p.y, draw:()=>ctx.drawImage(tvImg, p.x-8, p.y-8, 16,16)});
    if (p.type==='plant') drawables.push({y:p.y, draw:()=>ctx.drawImage(plantImg, p.x-8, p.y-14, 16,16)});
    if (p.type==='bowl') drawables.push({y:p.y, draw:()=>ctx.drawImage(bowlImg, p.x-8, p.y-6, 16,16)});
  }
  const rokiKey = (Roki.dir==='left'||Roki.dir==='right') ? 'side' : Roki.dir;
  const rimg = RokiSprites[rokiKey][Roki.frame];
  drawables.push({y:Roki.y+Roki.h, draw:()=>{
    ctx.save();
    if (Roki.dir==='left'){ ctx.translate(Roki.x*2+16,0); ctx.scale(-1,1); }
    ctx.drawImage(rimg, Roki.x-2, Roki.y-4, 16,16);
    ctx.restore();
  }});
  drawables.sort((a,b)=>a.y-b.y);
  for (const d of drawables) d.draw();

  drawInteractPrompts(0,0);
}

function wrapText(text, maxChars){
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words){
    if ((cur+' '+w).trim().length > maxChars){ lines.push(cur.trim()); cur = w; }
    else cur = (cur+' '+w).trim();
  }
  if (cur) lines.push(cur);
  return lines;
}

function drawDialogueBox(){
  if (!dialogue.active) return;
  const boxX = 3, boxY = VIEW_H-30, boxW = VIEW_W-6, boxH = 27;
  ctx.fillStyle = '#0d0d18';
  ctx.fillRect(boxX, boxY, boxW, boxH);
  ctx.fillStyle = '#f4f0e6';
  ctx.fillRect(boxX+2, boxY+2, boxW-4, boxH-4);
  ctx.fillStyle = '#0d0d18';
  ctx.fillRect(boxX+2, boxY+2, boxW-4, 2);
  ctx.fillRect(boxX+2, boxY+boxH-4, boxW-4, 2);
  ctx.fillRect(boxX+2, boxY+2, 2, boxH-4);
  ctx.fillRect(boxX+boxW-4, boxY+2, 2, boxH-4);

  ctx.fillStyle = '#1b1830';
  ctx.font = '7px monospace';
  ctx.textAlign = 'left';
  const lines = wrapText(dialogue.text, 26);
  lines.slice(0,2).forEach((line,i)=>{
    ctx.fillText(line, boxX+7, boxY+11+i*10);
  });
  // blinking continue indicator
  if (Math.floor(dialogue.t*4)%2===0){
    ctx.fillStyle = '#1b1830';
    ctx.beginPath();
    ctx.moveTo(boxX+boxW-9, boxY+boxH-7);
    ctx.lineTo(boxX+boxW-5, boxY+boxH-7);
    ctx.lineTo(boxX+boxW-7, boxY+boxH-4);
    ctx.closePath(); ctx.fill();
  }
}

function drawInteractPrompts(camX,camY){
  const rc = rokiCenter();
  const REACH = 16;
  const targets = [];
  if (scene === 'inside'){
    for (const p of indoorProps) targets.push([p.x,p.y]);
  } else {
    targets.push([john.x+8,john.y+8]);
    targets.push([alice.x+8,alice.y+8]);
    dogs.forEach(d=>targets.push([d.x+8,d.y+8]));
    strangers.forEach(s=>targets.push([s.x+8,s.y+8]));
    if (crow && !crow.befriended) targets.push([crow.x+8,crow.y+8]);
    for (const p of props){
      if (p.type==='treat' && !p.taken) targets.push([p.x,p.y]);
      if (p.type==='tree') targets.push([p.x,p.y]);
    }
  }
  for (const [tx,ty] of targets){
    if (dist(rc.x,rc.y,tx,ty) < REACH){
      ctx.fillStyle = '#fff'; ctx.font='8px monospace'; ctx.textAlign='center';
      ctx.fillText('A', tx-camX, ty-camY-18);
      break;
    }
  }
}

function drawHUD(){
  // backdrop so the HUD stays legible over busy backgrounds (esp. the indoor wallpaper)
  ctx.fillStyle = 'rgba(10,10,20,0.4)';
  ctx.fillRect(0, 0, 78, 30);
  // hearts
  for (let i=0;i<Roki.maxHearts;i++){
    ctx.fillStyle = i<Roki.hearts ? '#ff5b6b' : '#4a3a3a';
    const hx0 = 4+i*10, hy0 = 4;
    ctx.fillRect(hx0,hy0,8,7);
    ctx.fillStyle = i<Roki.hearts ? '#ff8b96' : '#5a4a4a';
    ctx.fillRect(hx0+1,hy0+1,2,2); ctx.fillRect(hx0+5,hy0+1,2,2);
  }
  // happiness bar
  const pct = happinessPercent();
  const barX = 4, barY = 14, barW = 70, barH = 6;
  ctx.fillStyle = '#1b1830'; ctx.fillRect(barX-1,barY-1,barW+2,barH+2);
  ctx.fillStyle = '#3a3a52'; ctx.fillRect(barX,barY,barW,barH);
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(barX,barY, barW*pct/100, barH);
  ctx.fillStyle = '#fff'; ctx.font='6px monospace'; ctx.textAlign='left';
  ctx.fillText('HAPPY '+pct+'%', barX, barY+13);
  // bonus challenge counter
  ctx.fillStyle = '#c9e8a0';
  ctx.fillText('BONUS '+challengeCount()+'/3', barX, barY+22);
}

/* =========================================================
   MAIN LOOP
========================================================= */
function frame(ts){
  if (!lastT) lastT = ts;
  let dt = (ts-lastT)/1000;
  lastT = ts;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

/* =========================================================
   RESIZE / SCALE
========================================================= */
function resize(){
  const wrap = document.getElementById('gameWrap');
  const controlsH = (window.innerWidth < 820) ? 0 : 0;
  const availW = window.innerWidth;
  const availH = window.innerHeight;
  let scale = Math.floor(Math.min(availW/VIEW_W, availH/VIEW_H));
  scale = Math.max(2, Math.min(6, scale));
  canvas.style.width = (VIEW_W*scale)+'px';
  canvas.style.height = (VIEW_H*scale)+'px';
}
window.addEventListener('resize', resize);

/* =========================================================
   INIT
========================================================= */
function init(){
  generateMap();
  generateIndoor();
  setupProps();
  spawnEntities();
  RokiSprites = buildRokiSet();
  setupTouch();
  resize();
  showTitle();
  requestAnimationFrame(frame);
}
init();

})();
</script>
