<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ROKI - A Very Good Boy</title>
<style>
  @font-face {
    font-family: 'PixelFont';
    src: local('Courier New');
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0f0f1a; overflow: hidden;
    font-family: 'Courier New', monospace;
    touch-action: none;
  }
  #gameWrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #0f0f1a;
  }
  #screen {
    position: relative;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    box-shadow: 0 0 0 4px #3a3a52, 0 0 24px rgba(0,0,0,0.6);
  }
  canvas { display: block; image-rendering: pixelated; }

  /* --- Touch controls --- */
  #touchLayer {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
  }
  .ctrlBtn {
    position: absolute; pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: 'Courier New', monospace; font-weight: bold;
    background: rgba(20,20,30,0.38); border: 2px solid rgba(255,255,255,0.5);
    -webkit-user-select: none; user-select: none;
  }
  .ctrlBtn:active, .ctrlBtn.pressed { background: rgba(255,255,255,0.35); }
  #dpad { position: absolute; left: 4vw; bottom: 6vh; width: 34vw; height: 34vw; max-width: 170px; max-height: 170px; }
  .dpadSeg { position: absolute; width: 34%; height: 34%; border-radius: 6px; font-size: 20px; }
  #dUp { top: 0; left: 33%; }
  #dDown { top: 66%; left: 33%; }
  #dLeft { top: 33%; left: 0; }
  #dRight { top: 33%; left: 66%; }
  #dCenter { top: 33%; left: 33%; background: rgba(20,20,30,0.15); border-color: rgba(255,255,255,0.25); }
  #actionWrap { position: absolute; right: 5vw; bottom: 7vh; width: 38vw; max-width: 190px; height: 20vw; max-height: 100px; }
  #btnA { position: absolute; right: 0; bottom: 0; width: 17vw; height: 17vw; max-width: 84px; max-height: 84px; border-radius: 50%; font-size: 22px; }
  #btnB { position: absolute; right: 19vw; bottom: 2vw; width: 13vw; height: 13vw; max-width: 64px; max-height: 64px; border-radius: 50%; font-size: 16px; opacity: 0.85; }
  #btnStart { position: absolute; top: 3vh; right: 3vw; width: 60px; height: 26px; border-radius: 12px; font-size: 9px; pointer-events: auto; }
  #btnMute { position: absolute; top: 3vh; left: 3vw; width: 34px; height: 34px; border-radius: 50%; font-size: 15px; pointer-events: auto; }
  #btnQuest { position: absolute; top: 3vh; right: calc(3vw + 68px); width: 34px; height: 34px; border-radius: 50%; font-size: 15px; pointer-events: auto; }

  @media (min-width: 820px) and (pointer: fine) {
    #dpad, #actionWrap { display: none; }
  }

  #overlay {
    position: fixed; inset: 0; z-index: 100; display: flex;
    align-items: center; justify-content: center; flex-direction: column;
    background: rgba(6,8,16,0.92); color: #f4f0e6; text-align: center;
    padding: 20px; display: none;
  }
  #overlay h1 { font-size: clamp(28px, 8vw, 54px); letter-spacing: 4px; margin: 0 0 6px; color: #ffd23f; text-shadow: 3px 3px 0 #7a4a1e, -2px -2px 0 #3a1f0a; }
  #overlay p { font-size: clamp(11px, 2.6vw, 15px); line-height: 1.7; max-width: 480px; margin: 6px 0; }
  #overlay button.bigBtn {
    margin-top: 18px; padding: 12px 26px; font-size: 14px; font-weight: bold;
    background: #ffd23f; color: #3a2a0f; border: 3px solid #3a2a0f; border-radius: 4px;
    cursor: pointer; letter-spacing: 1px; font-family: inherit;
  }
  #overlay button.bigBtn:active { transform: translateY(2px); }
  #questPanel {
    position: fixed; inset: 0; z-index: 90; display: none;
    align-items: center; justify-content: center; background: rgba(6,8,16,0.85);
  }
  #questBox {
    background: #1b1830; border: 3px solid #ffd23f; border-radius: 6px; padding: 16px 20px;
    max-width: 380px; width: 86%; color: #f4f0e6; font-size: 12px; line-height: 2;
  }
  #questBox h2 { color: #ffd23f; font-size: 14px; margin: 0 0 10px; letter-spacing: 2px; }
  .qItem { display: flex; align-items: center; gap: 8px; }
  .qDone { color: #7be07b; }
  .qTodo { color: #cfc9b8; opacity: 0.75; }
  #questBox .closeHint { margin-top: 12px; font-size: 10px; opacity: 0.6; text-align: center; }
</style>
</head>
<body>
<div id="gameWrap">
  <div id="screen">
    <canvas id="game" width="160" height="144"></canvas>
  </div>
</div>

<div id="touchLayer">
  <div id="dpad">
    <div id="dCenter" class="ctrlBtn"></div>
    <div id="dUp" class="ctrlBtn dpadSeg">&#9650;</div>
    <div id="dDown" class="ctrlBtn dpadSeg">&#9660;</div>
    <div id="dLeft" class="ctrlBtn dpadSeg">&#9664;</div>
    <div id="dRight" class="ctrlBtn dpadSeg">&#9654;</div>
  </div>
  <div id="actionWrap">
    <div id="btnB" class="ctrlBtn">B</div>
    <div id="btnA" class="ctrlBtn">A</div>
  </div>
  <div id="btnStart" class="ctrlBtn">START</div>
  <div id="btnMute" class="ctrlBtn">&#128266;</div>
  <div id="btnQuest" class="ctrlBtn">&#9776;</div>
</div>

<div id="overlay">
  <h1>ROKI</h1>
  <p id="overlaySub">a good boy's day out</p>
  <div id="overlayExtra"></div>
  <button class="bigBtn" id="overlayBtn">PRESS START</button>
</div>

<div id="questPanel">
  <div id="questBox">
    <h2>MAKE ROKI HAPPY</h2>
    <div id="questList"></div>
    <h2 style="margin-top:14px;">BONUS CHALLENGES</h2>
    <div id="bonusList"></div>
    <div class="closeHint">tap anywhere to close</div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   CONSTANTS
========================================================= */
const TILE = 16;
const VIEW_W = 160, VIEW_H = 144; // native GB-style resolution
const VIEW_TILES_X = VIEW_W / TILE, VIEW_TILES_Y = VIEW_H / TILE;
const MAP_W = 48, MAP_H = 36; // in tiles
const WORLD_W = MAP_W * TILE, WORLD_H = MAP_H * TILE;

// tile ids
const T = {
  GRASS: 0, GRASS2: 1, LAWN: 2, ROAD: 3, ROAD_LINE: 4, SIDEWALK: 5,
  DIRT: 6, HEDGE: 7, WALL: 8, ROOF: 9, DOOR: 10, WATER: 11
};

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* =========================================================
   PALETTE
========================================================= */
const PAL = {
  grassA: '#6fc752', grassB: '#5cb444', grassEdge: '#3d8a2c',
  lawnA: '#9ed66e', lawnB: '#8bc95c',
  roadA: '#726f78', roadB: '#5d5a63', roadLine: '#e8dfc0',
  sidewalkA: '#d4cbb0', sidewalkB: '#c7bc9c',
  dirtA: '#9a6b3f', dirtB: '#875a33',
  hedge: '#2f6b22',
  sky: '#8fc7e8',
  waterA: '#5ba9d9', waterB: '#4a94c4',
  flowerRed: '#e85a5a', flowerYellow: '#f0d23a', flowerWhite: '#f5f0e6'
};

/* =========================================================
   SPRITE BUILDER  (pixel-string -> offscreen canvas)
========================================================= */
function spr(rows, palette){
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const img = g.createImageData(w, h);
  for (let y = 0; y < h; y++){
    for (let x = 0; x < w; x++){
      const ch = rows[y][x];
      const col = palette[ch];
      const i = (y*w+x)*4;
      if (!col){ img.data[i+3] = 0; continue; }
      img.data[i] = col[0]; img.data[i+1] = col[1]; img.data[i+2] = col[2]; img.data[i+3] = col[3] === undefined ? 255 : col[3];
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}
function hx(hex){
  const n = parseInt(hex.slice(1), 16);
  return [(n>>16)&255, (n>>8)&255, n&255, 255];
}

/* =========================================================
   ROKI SPRITES  (black coat, white chest, brown eyebrow dots,
   brown paws, semi-flopped ears, swishy tail)
========================================================= */
const P_ROKI = {
  '.': null,
  'K': hx('#1c1c1c'),   // black coat
  'k': hx('#141414'),   // black shade
  'W': hx('#f5f2ea'),   // white chest
  'w': hx('#ded8c8'),   // white shade
  'B': hx('#8a5a34'),   // brown (eyebrows/paws)
  'b': hx('#6e4527'),   // brown shade
  'E': hx('#2a2a2a'),   // eye
  'e': hx('#ffffff'),   // eye glint
  'N': hx('#0d0d0d'),   // nose
  'P': hx('#e39aa6'),   // tongue
};

// --- Grid builder: avoids hand-counted-string misalignment bugs ---
function blankGrid(w,h,fill){ return Array.from({length:h}, ()=> new Array(w).fill(fill)); }
function grect(g,x,y,w,h,ch){ for(let yy=y;yy<y+h;yy++){ if(!g[yy])continue; for(let xx=x;xx<x+w;xx++){ if(xx>=0&&xx<g[0].length) g[yy][xx]=ch; } } }
function gpx(g,x,y,ch){ if(g[y] && x>=0 && x<g[0].length) g[y][x]=ch; }
function gRows(g){ return g.map(r=>r.join('')); }

// DOWN (facing player) - big-headed chibi pose for extra cuteness, two frames
function rokiDownGrid(bounce){
  const g = blankGrid(16,16,'.');
  // big rounded floppy ears
  grect(g,1,2,4,4,'K'); grect(g,11,2,4,4,'K');
  grect(g,2,3,2,2,'k'); grect(g,12,3,2,2,'k');
  gpx(g,1, bounce?4:3, 'k'); gpx(g,14, bounce?4:3, 'k');
  // big round head (chibi proportions)
  grect(g,2,3,12,7,'K');
  grect(g,3,2,10,1,'K');
  // big sparkly eyes
  grect(g,4,6,3,3,'W'); grect(g,9,6,3,3,'W');
  grect(g,5,7,2,2,'E'); grect(g,10,7,2,2,'E');
  gpx(g,5,7,'e'); gpx(g,10,7,'e');
  // brown eyebrow dots
  gpx(g,5,5,'B'); gpx(g,10,5,'B');
  // small snout + nose
  grect(g,6,9,4,2,'w'); gpx(g,7,9,'N'); gpx(g,8,9,'N');
  gpx(g,7,10,'P');
  // small chubby body (smaller than head = cute)
  grect(g,4,10,8,4,'K');
  grect(g,6,11,4,3,'W');
  // little paws
  grect(g,4, bounce?14:13,2,2,'B'); grect(g,10, bounce?14:13,2,2,'B');
  // tiny tail peek
  gpx(g,2, bounce?13:14,'b'); gpx(g,1, bounce?12:13,'b');
  return gRows(g);
}
const ROKI_DOWN_0 = rokiDownGrid(false);
const ROKI_DOWN_1 = rokiDownGrid(true);

// UP (back view) - big round head/back, no face, tail swishes side to side
function rokiUpGrid(tailRight){
  const g = blankGrid(16,16,'.');
  // ear bumps sticking up
  grect(g,1,1,4,4,'K'); grect(g,11,1,4,4,'K');
  grect(g,2,2,2,2,'k'); grect(g,12,2,2,2,'k');
  // big rounded head+body, SAME width top to bottom (no taper = reads as a
  // round chibi back, not a triangle)
  grect(g,2,3,12,12,'K');
  grect(g,3,2,10,1,'K');
  // subtle neck shade so head/body don't read as one flat slab
  grect(g,2,9,12,1,'k');
  // little paw hints at the bottom
  grect(g,3,14,2,1,'B'); grect(g,11,14,2,1,'B');
  // tail poking out one side, swishing frame to frame
  if (tailRight){ grect(g,13,9,3,3,'b'); grect(g,14,6,2,4,'b'); grect(g,14,4,2,2,'K'); }
  else { grect(g,0,9,3,3,'b'); grect(g,0,6,2,4,'b'); gpx(g,0,4,'K'); gpx(g,1,4,'K'); }
  return gRows(g);
}
const ROKI_UP_0 = rokiUpGrid(false);
const ROKI_UP_1 = rokiUpGrid(true);

// SIDE (right-facing profile) - big head, cute stubby legs, tail out back
// layout left-to-right: tail(0-2) | ear(3-7) | head+eye(6-10) | snout(11-13)
function rokiSideGrid(strideA){
  const g = blankGrid(16,16,'.');
  // tail (out the back / left side)
  grect(g,0,7,2,2,'b'); grect(g,1,5,2,3,'b');
  // big rounded ear flop
  grect(g,4,1,4,4,'K'); gpx(g,4,4,'k'); gpx(g,5,5,'k');
  // big round head
  grect(g,3,3,10,6,'K');
  // eye near the front of the head, just before the snout
  grect(g,8,6,3,3,'W'); grect(g,9,7,2,2,'E'); gpx(g,9,7,'e');
  gpx(g,9,5,'B');
  // snout pointing right
  grect(g,11,7,3,2,'K'); gpx(g,13,8,'N');
  // small chubby body
  grect(g,3,9,10,4,'K');
  grect(g,4,10,8,2,'W');
  // stubby legs (alternate stride)
  if (strideA){
    grect(g,4,13,2,2,'B'); grect(g,10,13,2,2,'K');
    grect(g,7,13,2,2,'K'); grect(g,12,13,1,2,'B');
  } else {
    grect(g,4,13,2,2,'K'); grect(g,10,13,2,2,'B');
    grect(g,7,13,2,2,'B'); grect(g,12,13,1,2,'K');
  }
  return gRows(g);
}
const ROKI_SIDE_0 = rokiSideGrid(false);
const ROKI_SIDE_1 = rokiSideGrid(true);

function buildRokiSet(){
  return {
    down: [spr(ROKI_DOWN_0,P_ROKI), spr(ROKI_DOWN_1,P_ROKI)],
    up: [spr(ROKI_UP_0,P_ROKI), spr(ROKI_UP_1,P_ROKI)],
    side: [spr(ROKI_SIDE_0,P_ROKI), spr(ROKI_SIDE_1,P_ROKI)]
  };
}

/* =========================================================
   HUMAN NPC SPRITES (generic 16x16, front-facing walk)
========================================================= */
function humanSprite(skin, hair, shirt, pants){
  const pal = { '.':null, 'H': hx(hair), 'S': hx(skin), 'C': hx(shirt), 'c': shade(shirt,0.8),
    'P': hx(pants), 'p': shade(pants,0.8), 'E': hx('#1c1c1c'), 'W': hx('#ffffff') };
  const f0 = [
  "................",
  "....HHHHHH......",
  "...HHHHHHHH.....",
  "...HSSSSSSH.....",
  "...SSEsSEsS.....",
  "...SSSSSSSS.....",
  "....SSSSSS......",
  "...CCCCCCCC.....",
  "..CCCCCCCCCC....",
  "..CCCSSSSCCC....",
  "..CCCCCCCCCC....",
  "...PPP..PPP.....",
  "...PPP..PPP.....",
  "...PP....PP.....",
  "..WW......WW....",
  "................"];
  const f1 = f0.map(r=>r); // reuse; walk handled via bob in draw
  pal['s'] = hx('#1c1c1c');
  return { down:[spr(fixEye(f0),pal), spr(fixEye(f0),pal)], up:[spr(f0.map(r=>r.replace(/E.E./,'HHHH')),pal),spr(f0.map(r=>r.replace(/E.E./,'HHHH')),pal)],
           side:[spr(fixEye(f0),pal), spr(fixEye(f0),pal)] };
}
function fixEye(rows){ return rows.map(r=>r.replace('E','E')); }
function shade(hexcol, mul){
  const c = hx(hexcol);
  return [Math.floor(c[0]*mul), Math.floor(c[1]*mul), Math.floor(c[2]*mul), 255];
}

/* =========================================================
   MAP GENERATION
========================================================= */
let mapTiles = []; // [row][col] -> tile id
let solid = [];    // [row][col] -> bool
let buildings = []; // {x,y,w,h,wall,roof,label}
let props = [];     // trees, bed, ball, treat, signs (world px positions)
let HOME_DOOR = null; // {tx,ty} tile coords of the walkable doorway into home

/* =========================================================
   INDOOR (HOME INTERIOR) SCENE
========================================================= */
const INDOOR_W = VIEW_TILES_X, INDOOR_H = VIEW_TILES_Y; // room fits the screen exactly, no scrolling
let scene = 'outside'; // 'outside' | 'inside'
let indoorSolid = [];
let indoorProps = [];
const INDOOR_ENTRY = { x: 4.5*TILE, y: 6*TILE };
const INDOOR_DOOR_TILE = { tx: 4, ty: 8 };

function generateIndoor(){
  indoorSolid = new Array(INDOOR_H);
  for (let r=0;r<INDOOR_H;r++) indoorSolid[r] = new Array(INDOOR_W).fill(false);
  // walls around the room
  for (let c=0;c<INDOOR_W;c++){ indoorSolid[0][c]=true; indoorSolid[INDOOR_H-1][c]=true; }
  for (let r=0;r<INDOOR_H;r++){ indoorSolid[r][0]=true; indoorSolid[r][INDOOR_W-1]=true; }
  // doorway gap at the bottom (walkable exit)
  indoorSolid[INDOOR_H-1][INDOOR_DOOR_TILE.tx] = false;
  indoorSolid[INDOOR_H-1][INDOOR_DOOR_TILE.tx+1] = false;
  // furniture footprints
  indoorSolid[1][1]=true; indoorSolid[1][2]=true; indoorSolid[2][1]=true; indoorSolid[2][2]=true; // bed
  indoorSolid[1][7]=true; indoorSolid[1][8]=true; // TV
  indoorSolid[6][8]=true; // plant

  indoorProps = [
    { type:'bed', x:1.5*TILE, y:2*TILE+6 },
    { type:'tv', x:7.5*TILE, y:1*TILE+8 },
    { type:'bowl', x:7*TILE, y:6*TILE+6 },
    { type:'plant', x:8*TILE+4, y:6*TILE+10 }
  ];
}

function enterHome(){
  scene = 'inside';
  Roki.x = INDOOR_ENTRY.x - Roki.w/2; Roki.y = INDOOR_ENTRY.y - Roki.h/2;
  Audio8.sfx('select');
}
function exitHome(){
  scene = 'outside';
  Roki.x = HOME_DOOR.tx*TILE - 2; Roki.y = (HOME_DOOR.ty+1)*TILE + 2;
  Audio8.sfx('select');
}

function inRect(c,r,rect){ return c>=rect.x && c<rect.x+rect.w && r>=rect.y && r<rect.y+rect.h; }

function generateMap(){
  mapTiles = new Array(MAP_H);
  solid = new Array(MAP_H);
  for (let r=0;r<MAP_H;r++){
    mapTiles[r] = new Array(MAP_W).fill(T.LAWN);
    solid[r] = new Array(MAP_W).fill(false);
  }

  const SHATTUCK = 20; // vertical divider col (road at 20-21)
  const isPark = (c) => c >= 22;

  // base fill
  for (let r=0;r<MAP_H;r++){
    for (let c=0;c<MAP_W;c++){
      mapTiles[r][c] = isPark(c) ? (((r+c)%5===0)?T.GRASS2:T.GRASS) : (((r+c)%7===0)?T.LAWN:T.GRASS2);
    }
  }

  function hRoad(r0, c0, c1){
    for (let r=r0;r<r0+2;r++) for (let c=c0;c<=c1;c++){ mapTiles[r][c] = (r===r0)? T.ROAD_LINE : T.ROAD; }
  }
  function vRoad(c0, r0, r1){
    for (let c=c0;c<c0+2;c++) for (let r=r0;r<=r1;r++){ mapTiles[r][c] = (c===c0)? T.ROAD : T.ROAD_LINE; }
  }

  // Horizontal roads (full width)
  hRoad(0, 0, MAP_W-1);      // 62nd St (top edge)
  hRoad(10, 0, MAP_W-1);     // Poirier St / 61st St
  hRoad(30, 0, MAP_W-1);     // 59th St (park south edge)
  // west-only
  hRoad(19, 0, 20);          // 60th St

  // Vertical roads
  vRoad(SHATTUCK, 0, MAP_H-1); // Shattuck Ave (full)
  vRoad(4, 0, 30);             // Dover St
  vRoad(12, 0, 30);            // Whitney St
  vRoad(40, 0, 31);            // Racine St
  vRoad(46, 0, MAP_H-1);       // Telegraph Ave

  // sidewalk fringe next to roads (purely cosmetic, walkable)
  function fringe(r,c){ if (r>=0&&r<MAP_H&&c>=0&&c<MAP_W && mapTiles[r][c]!==T.ROAD && mapTiles[r][c]!==T.ROAD_LINE) { if(Math.random()<1) mapTiles[r][c]=T.SIDEWALK; } }

  function addBuilding(x,y,w,h,wall,roof,label,hasDoor){
    buildings.push({x,y,w,h,wall,roof,label});
    for (let r=y;r<y+h;r++){
      for (let c=x;c<x+w;c++){
        if (r<0||r>=MAP_H||c<0||c>=MAP_W) continue;
        mapTiles[r][c] = (r===y) ? T.ROOF : T.WALL;
        solid[r][c] = true;
      }
    }
    if (hasDoor){
      // two tiles wide so walking up into it isn't a pixel-perfect ordeal
      const doorC = x + Math.floor(w/2) - 1, doorR = y+h-1;
      solid[doorR][doorC] = false;
      solid[doorR][doorC+1] = false;
      return { tx: doorC, ty: doorR, tw: 2 };
    }
  }

  // ---- Neighborhood buildings ----
  HOME_DOOR = addBuilding(6,2,3,3,'#dfe7ee','#3a6ea5','HOME', true); // Roki's home (blue roof, matches map pin)
  addBuilding(0,2,3,3,'#b9b9b9','#c97a2e','CONSTRUCTION');    // construction site, top-left
  addBuilding(15,2,4,3,'#e3cf8f','#7a4a2e','ROW HOUSES');
  addBuilding(14,12,5,4,'#e0b98a','#7a3b2e','SHEWHAT CAFE');  // restaurant
  addBuilding(0,12,3,3,'#e3cf8f','#5a5a5a','ROW HOUSES');
  addBuilding(6,12,5,3,'#d9c1a3','#6b4a2e','ROW HOUSES');
  addBuilding(0,21,3,4,'#e3cf8f','#7a4a2e','ROW HOUSES');
  addBuilding(6,21,5,4,'#d9c1a3','#5a5a5a','ROW HOUSES');
  addBuilding(14,21,5,4,'#e0b98a','#6b4a2e','ROW HOUSES');

  // ---- East side buildings ----

      if (dr*dr+dc*dc <= pondR*pondR+1){ mapTiles[r][c]=T.WATER; solid[r][c]=true; }

  const diaCx=35, diaCy=23, diaR=4;

      if (Math.abs(r-diaCy)+Math.abs(c-diaCx) <= diaR){ mapTiles[r][c]=T.DIRT; }
    }
  }
