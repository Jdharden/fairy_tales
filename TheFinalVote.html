<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Mole — Final Vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Black&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#D9DED3; --card:#F5F6F1; --ink:#1A1D19; --muted:#6B7268;
    --line:#B9BFB2; --oxblood:#7A1F2B; --ochre:#B98A2E; --focus:#2E4A7D;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:'Archivo',system-ui,sans-serif;font-size:16px;line-height:1.5;
    background-image:radial-gradient(circle at 1px 1px, rgba(26,29,25,.055) 1px, transparent 0);
    background-size:22px 22px;-webkit-font-smoothing:antialiased;
  }
  .shell{max-width:1120px;margin:0 auto;padding:0 20px 140px}

  .topbar{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    padding:22px 0 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;
    font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted)}
  .topbar b{color:var(--oxblood)}

  .display{font-family:'Archivo Black',sans-serif;font-weight:400;text-transform:uppercase;
    letter-spacing:-.02em;line-height:.95;margin:0}
  .eyebrow{font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--muted);margin:0 0 14px}
  .lede{max-width:48ch;color:#3B4038;margin:20px 0 0;font-size:16.5px}

  .screen{display:none}
  .screen.is-on{display:block;animation:lift .5s cubic-bezier(.2,.7,.3,1) both}
  @keyframes lift{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* intro */
  .intro-title{font-size:clamp(44px,8vw,84px);margin-top:44px}
  .intro-title em{font-style:normal;color:var(--oxblood)}
  .namefield{margin-top:34px;max-width:400px}
  label.fieldlabel{display:block;font-family:'Courier Prime',monospace;font-size:11px;
    letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  input[type=text]{width:100%;padding:13px 14px;border:1px solid var(--ink);background:var(--card);
    font-family:'Archivo',sans-serif;font-size:17px;color:var(--ink);border-radius:2px}
  input[type=text]:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

  .btn{display:inline-flex;align-items:center;gap:12px;cursor:pointer;
    background:var(--ink);color:var(--card);border:1px solid var(--ink);border-radius:2px;
    font-family:'Archivo',sans-serif;font-size:13px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;padding:15px 24px;transition:background .16s,color .16s}
  .btn:hover:not([disabled]){background:var(--oxblood);border-color:var(--oxblood)}
  .btn[disabled]{opacity:.32;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.ghost:hover{background:var(--ink);color:var(--card)}
  .btn-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:34px}

  /* the board */
  .board-head{margin:34px 0 26px}
  .prompt{font-weight:600;font-size:clamp(24px,3.6vw,36px);line-height:1.12;letter-spacing:-.01em;margin:0}
  .board{
    display:grid;gap:14px;list-style:none;padding:0;margin:0;
    grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
  }
  .suspect{
    display:block;width:100%;padding:0;cursor:pointer;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:2px;
    font:inherit;color:inherit;overflow:hidden;position:relative;
    transition:border-color .16s,transform .16s,box-shadow .16s;
  }
  .suspect .frame{position:relative;aspect-ratio:1/1;overflow:hidden;background:#C6CBC0;display:block}
  .suspect img{width:100%;height:100%;object-fit:cover;display:block;
    filter:grayscale(1) contrast(1.06);transition:filter .25s}
  .suspect .initials{position:absolute;inset:0;display:grid;place-items:center;
    font-family:'Archivo Black',sans-serif;font-size:34px;color:#8A9184}
  .suspect .nameplate{
    display:block;padding:10px 11px;font-size:14.5px;font-weight:600;line-height:1.25;
    border-top:1px solid var(--line);transition:background .16s,color .16s,border-color .16s;
  }
  .suspect .tag{
    position:absolute;top:9px;left:9px;font-family:'Courier Prime',monospace;font-size:10px;
    letter-spacing:.14em;background:rgba(26,29,25,.82);color:var(--card);padding:3px 7px;border-radius:2px;
  }
  .suspect .stamp{
    position:absolute;right:8px;bottom:8px;opacity:0;transform:rotate(-6deg) scale(.86);
    font-family:'Courier Prime',monospace;font-weight:700;font-size:10px;letter-spacing:.2em;
    color:var(--card);background:var(--oxblood);border:2px solid var(--card);padding:5px 8px;
    transition:opacity .2s,transform .24s cubic-bezier(.2,.9,.3,1.3);
  }
  .suspect:hover{border-color:var(--ink);transform:translateY(-2px)}
  .suspect:hover img{filter:grayscale(.35) contrast(1.02)}
  .suspect[aria-pressed="true"]{border-color:var(--oxblood);box-shadow:0 0 0 2px var(--oxblood)}
  .suspect[aria-pressed="true"] img{filter:none}
  .suspect[aria-pressed="true"] .nameplate{background:var(--oxblood);color:var(--card);border-color:var(--oxblood)}
  .suspect[aria-pressed="true"] .stamp{opacity:1;transform:rotate(-6deg) scale(1)}
  .board.has-pick .suspect:not([aria-pressed="true"]){opacity:.58}
  .board.has-pick .suspect:not([aria-pressed="true"]):hover{opacity:1}

  /* sticky decision bar */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:var(--card);border-top:1px solid var(--ink);
    box-shadow:0 -6px 22px rgba(26,29,25,.14);
    transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.7,.3,1);
  }
  .bar.is-up{transform:none}
  .bar-in{max-width:1120px;margin:0 auto;padding:13px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .bar-who{display:flex;align-items:center;gap:12px;min-width:0}
  .bar-who img{width:42px;height:42px;object-fit:cover;border:1px solid var(--ink);border-radius:2px;flex:0 0 42px}
  .bar-who .k{font-family:'Courier Prime',monospace;font-size:10px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--muted);display:block}
  .bar-who .n{font-weight:600;font-size:17px;line-height:1.2;display:block}

  .alert{margin-top:20px;padding:12px 14px;border-left:3px solid var(--oxblood);
    background:rgba(122,31,43,.09);font-size:14px;color:#5C1A22}
  .alert:empty{display:none}
  .done-mark{display:inline-block;border:2px solid var(--oxblood);color:var(--oxblood);
    font-family:'Courier Prime',monospace;font-weight:700;font-size:13px;letter-spacing:.28em;
    padding:9px 16px;transform:rotate(-2.5deg);margin:44px 0 26px}
  .done-face{display:flex;align-items:center;gap:16px;margin-top:28px}
  .done-face img{width:96px;height:96px;object-fit:cover;border:1px solid var(--ink);border-radius:2px}

  @media (max-width:520px){
    .board{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:11px}
    .bar-in{padding:11px 16px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div>Final vote · <b id="roundName">The Mole</b></div>
    <div id="counter">Not started</div>
  </div>

  <!-- INTRO -->
  <section class="screen is-on" id="scr-intro">
    <p class="eyebrow" style="margin-top:40px">One name · No going back</p>
    <h1 class="display intro-title">Name the<br><em>Mole</em>.</h1>
    <p class="lede" id="introLede">Every face on the board is still in the game. Pick the one you believe has been working against you.</p>
    <div class="namefield">
      <label class="fieldlabel" for="playerName">Your name</label>
      <input type="text" id="playerName" autocomplete="name" placeholder="Enter your name">
    </div>
    <div class="btn-row"><button class="btn" id="startBtn">See the board</button></div>
    <div class="alert" id="introAlert" role="alert"></div>
  </section>

  <!-- BOARD -->
  <section class="screen" id="scr-board">
    <div class="board-head">
      <p class="eyebrow">Tap a face to accuse</p>
      <h2 class="prompt" id="promptText"></h2>
    </div>
    <div class="board" id="board" role="group" aria-label="Suspects"></div>
  </section>

  <!-- DONE -->
  <section class="screen" id="scr-done">
    <div class="done-mark">Vote recorded</div>
    <h2 class="display" style="font-size:clamp(30px,5vw,52px)" id="doneTitle">Your vote<br>is locked in</h2>
    <div class="done-face" id="doneFace"></div>
    <p class="lede">Nothing more to do. Results are revealed at the execution.</p>
  </section>

</div>

<!-- decision bar -->
<div class="bar" id="bar">
  <div class="bar-in">
    <div class="bar-who" id="barWho"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn ghost" id="clearBtn">Clear</button>
      <button class="btn" id="submitBtn">Lock in my vote</button>
    </div>
  </div>
</div>

function initials(n){
  var p = n.trim().split(/\s+/);
  return ((p[0]||'')[0] || '?').toUpperCase() + ((p[1]||'')[0] || '').toUpperCase();
}

/* ---- board ---- */
function renderBoard(){
  var board = $('board');
  board.innerHTML = '';
  FORM.people.forEach(function(person, idx){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'suspect';
    b.setAttribute('aria-pressed','false');
    b.setAttribute('aria-label','Accuse ' + person.name);

    var frame = document.createElement('span');
    frame.className = 'frame';
    if (person.photo){
      var img = document.createElement('img');
      img.src = person.photo; img.alt = ''; img.loading = 'lazy';
      frame.appendChild(img);
    } else {
      var ini = document.createElement('span');
      ini.className = 'initials'; ini.textContent = initials(person.name);
      frame.appendChild(ini);
    }
    var tag = document.createElement('span');
    tag.className = 'tag'; tag.textContent = String(idx+1).padStart(2,'0');
    frame.appendChild(tag);

    var stamp = document.createElement('span');
    stamp.className = 'stamp'; stamp.textContent = 'ACCUSED';
    frame.appendChild(stamp);

    var plate = document.createElement('span');
    plate.className = 'nameplate'; plate.textContent = person.name;

    b.appendChild(frame); b.appendChild(plate);
    b.onclick = function(){ choose(idx); };
    board.appendChild(b);
  });
}

function choose(idx){
  state.pick = idx;
  var btns = $('board').querySelectorAll('.suspect');
  for (var i=0;i<btns.length;i++) btns[i].setAttribute('aria-pressed', i===idx ? 'true' : 'false');
  $('board').classList.add('has-pick');

  var person = FORM.people[idx];
  var who = $('barWho');
  who.innerHTML = '';
  if (person.photo){
    var img = document.createElement('img');
    img.src = person.photo; img.alt = '';
    who.appendChild(img);
  }
  var txt = document.createElement('div');
  var k = document.createElement('span'); k.className='k'; k.textContent='Your accusation';
  var n = document.createElement('span'); n.className='n'; n.textContent = person.name;
  txt.appendChild(k); txt.appendChild(n);
  who.appendChild(txt);

  $('bar').classList.add('is-up');
  $('counter').textContent = 'Accusing ' + person.name;
}

function clearPick(){
  state.pick = null;
  var btns = $('board').querySelectorAll('.suspect');
  for (var i=0;i<btns.length;i++) btns[i].setAttribute('aria-pressed','false');
  $('board').classList.remove('has-pick');
  $('bar').classList.remove('is-up');
  $('counter').textContent = 'No accusation yet';
}

/* ---- flow ---- */
$('startBtn').onclick = function(){
  var name = $('playerName').value.trim();
  if (!name){
    $('introAlert').textContent = 'Enter your name so your vote can be counted.';
    $('playerName').focus();
    return;
  }
  $('introAlert').textContent = '';
  state.player = name;
  $('counter').textContent = 'No accusation yet';
  show('board');
};
$('playerName').addEventListener('keydown', function(e){ if (e.key==='Enter') $('startBtn').click(); });
$('clearBtn').onclick = clearPick;

$('submitBtn').onclick = function(){
  if (state.sent || state.pick === null) return;
  var person = FORM.people[state.pick];
  var btn = this;

  if (!FORM.endpoint || FORM.endpoint.indexOf('http') !== 0){
    alert('No Google Sheet is connected yet. Add your Apps Script web app URL to the endpoint field in this file, then reload.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Submitting…';

  fetch(FORM.endpoint, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({
      round: FORM.round,
      player: state.player,
      questions: [FORM.prompt],
      answers: [person.name],
      submittedAt: new Date().toISOString()
    })
  })
  .then(function(r){ return r.json().catch(function(){ return {status:'ok'}; }); })
  .then(function(res){
    if (res && res.status === 'error') throw new Error(res.message || 'The sheet rejected the entry.');
    state.sent = true;
    $('bar').classList.remove('is-up');
    $('counter').textContent = 'Submitted';
    $('doneTitle').innerHTML = 'You named<br>' + person.name.replace(/[<>&]/g,'');
    var face = $('doneFace');
    face.innerHTML = '';
    if (person.photo){
      var img = document.createElement('img'); img.src = person.photo; img.alt = '';
      face.appendChild(img);
    }
    show('done');
  })
  .catch(function(err){
    btn.disabled = false;
    btn.textContent = 'Lock in my vote';
    alert('That did not reach the sheet: ' + err.message + '\n\nCheck that the Apps Script is deployed with access set to Anyone, then try again.');
  });
};

/* ---- boot ---- */
$('roundName').textContent = FORM.round;
document.title = FORM.round + ' — Final Vote';
$('promptText').textContent = FORM.prompt;
renderBoard();
</script>
</body>
</html>
